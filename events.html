window.__arFonts=function(){if(document.getElementById("arFonts"))return;var k=document.createElement("link");k.id="arFonts";k.rel="stylesheet";k.href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap";document.head.appendChild(k);};
(function(){var l="en";try{l=localStorage.getItem("anneshop-lang")||((navigator.language||"").toLowerCase().indexOf("ar")===0?"ar":"en")}catch(e){}
if(l!=="ar")l="en";var h=document.documentElement;h.lang=l;h.dir=l==="ar"?"rtl":"ltr";h.className="boot";if(l==="ar")window.__arFonts();})();

<style>
:root{
  --bg:#f5e8e2; --paper:#fbf3ee; --ink:#47302f; --muted:#85676a;
  --rose:#c98f91; --rose-deep:#a8656b; --sage:#a9b6a0; --sage-deep:#5f7259;
  --line:#e2cbc4; --btn:#8f525a; --btn-ink:#fff8f4; --chip:#efdcd5; --shadow:rgba(90,50,50,.14); --ann:#dfe5d8; --ann-ink:#34402f;
  --f-display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --f-body:"Karla","Trebuchet MS",system-ui,sans-serif;
  --f-hand:"Caveat","Bradley Hand",cursive;
  --dir:1; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#271c1e; --paper:#33262a; --ink:#f3e4de; --muted:#c3a7a3;
  --rose:#d9a1a3; --rose-deep:#e1a3a6; --sage:#7f9177; --sage-deep:#b2c4a8;
  --line:#4a3739; --btn:#e2aaac; --btn-ink:#2a1d1f; --chip:#3d2d30; --shadow:rgba(0,0,0,.35); --ann:#3a4636; --ann-ink:#e4edd9; color-scheme:dark}}
html[dir="rtl"]{--dir:-1}
html[lang="ar"]{--f-display:"Amiri","Cormorant Garamond",Georgia,serif;--f-body:"Tajawal","Karla",system-ui,sans-serif;--f-hand:"Amiri",serif}

*{box-sizing:border-box}
[hidden]{display:none!important}
.boot *,.boot *::before,.boot *::after{transition:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);
  background-image:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--rose) 14%,transparent),transparent 45%),radial-gradient(circle at 100% 40%,color-mix(in srgb,var(--sage) 16%,transparent),transparent 40%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
img{max-width:100%}
html{-webkit-tap-highlight-color:rgba(168,101,107,.18)}
button,a,input,select,summary,label{touch-action:manipulation}
.detail,.db,.panel,.lb{overscroll-behavior:contain}
.x{min-width:44px;min-height:44px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.12;margin:0;text-wrap:balance}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
.hand{font-family:var(--f-hand);font-size:1.45rem;color:var(--rose-deep);line-height:1.1;margin:0}
.eyebrow{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
html[lang="ar"] .eyebrow,html[lang="ar"] .tag{letter-spacing:0;text-transform:none}

/* announcement */
.ann{background:var(--ann);color:var(--ann-ink);font-size:.92rem}
.annin{display:flex;align-items:center;justify-content:center;gap:12px;padding-block:8px;text-align:center}
.annin a{font-weight:700}
.annin button{background:none;border:0;color:inherit;font-size:1.3rem;line-height:1;padding:2px 6px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none}
.logo b{font:600 1.75rem var(--f-display);letter-spacing:.01em}
.logo span{font:500 1.25rem var(--f-hand);color:var(--rose-deep)}
nav{display:flex;align-items:center;gap:16px}
nav a.lnk{text-decoration:none;font-size:.92rem;color:var(--muted)}
nav a.lnk:hover{color:var(--ink)}
.langbtn{background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:700}
.cartbtn{display:flex;align-items:center;gap:8px;background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:.9rem}
.cartbtn i{font-style:normal;background:var(--btn-ink);color:var(--btn);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.78rem;padding:0 6px}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-block:48px 40px}
.hero>*{min-width:0}
.hero h1{font-size:clamp(2.6rem,6.5vw,4.6rem);margin:12px 0 18px}
.hero h1 em{color:var(--rose-deep);font-weight:500}
.hero p.lead{max-width:46ch;color:var(--muted);font-size:1.08rem;margin:0 0 26px}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-block;background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:13px 26px;font-weight:700;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rose-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.plate{position:relative;aspect-ratio:1/1.05;max-width:440px;width:100%;margin-inline:auto;background:var(--paper);border-radius:46% 46% 8px 8px/38% 38% 8px 8px;
  border:1px solid var(--line);box-shadow:0 18px 40px var(--shadow);display:grid;place-items:center}
.plate::after{content:"";position:absolute;inset:10px;border:1.5px dashed var(--rose);border-radius:inherit;opacity:.55;pointer-events:none}
.plate svg{width:78%;height:auto}
.stamp{position:absolute;inset-inline-end:-6px;bottom:22px;transform:rotate(-9deg);background:var(--sage);color:#26301f;border-radius:50%;width:92px;height:92px;display:grid;place-items:center;text-align:center;
  font:600 .98rem/1.05 var(--f-display);border:2px dashed #26301f55;padding:8px}

.scallop{height:16px;background:radial-gradient(circle at 10px 0,transparent 9px,var(--chip) 9.5px) 0 0/20px 16px repeat-x}
.promise{background:var(--chip);padding-block:18px}
.promise ul{list-style:none;margin:0 auto;padding:0;max-width:1120px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 28px;font-family:var(--f-display);font-size:1.2rem;font-style:italic}
html[lang="ar"] .promise ul{font-style:normal}
.promise li::before{content:"\2766";color:var(--rose-deep);margin-inline-end:9px;font-style:normal}

/* shop */
section{padding-block:56px 12px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
.head h2{font-size:clamp(2rem,4.5vw,3rem)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input,.tools select{font:400 .95rem var(--f-body);color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px}
.tools input{width:min(260px,100%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 16px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.grid>p{grid-column:1/-1;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 22px 22px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .25s,box-shadow .25s}
@media (hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 14px 28px var(--shadow)}}
.art{aspect-ratio:1/.92;display:grid;place-items:center;position:relative;border-bottom:1px solid var(--line);text-decoration:none}
.art svg{width:74%;height:auto}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:12px;inset-inline-start:12px;background:var(--rose-deep);color:var(--btn-ink);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:3px 10px;border-radius:3px;z-index:1}
.info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:1.5rem}
.info h3 a{text-decoration:none}
.notes{color:var(--muted);font-size:.92rem;margin:0}
.size{font-family:var(--f-hand);font-size:1.2rem;color:var(--sage-deep)}
.buy{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:12px}
.price{font:600 1.35rem var(--f-display)}
.add{background:transparent;color:var(--ink);border:1.5px solid var(--rose-deep);border-radius:999px;padding:7px 16px;font-weight:700;font-size:.88rem;text-decoration:none;display:inline-block;white-space:nowrap}
@media (hover:hover){.add:hover{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}}
.add:active{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.add:disabled{opacity:.5;cursor:not-allowed}

/* story + custom */
.story{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px;align-items:center}
.story>*{min-width:0}
.note{background:var(--paper);border:1px solid var(--line);padding:30px 28px;transform:rotate(-1.6deg);box-shadow:0 10px 24px var(--shadow);
  background-image:repeating-linear-gradient(transparent 0 31px,color-mix(in srgb,var(--rose) 28%,transparent) 31px 32px)}
.note p{font-family:var(--f-hand);font-size:1.6rem;line-height:32px;margin:0}
.story h2{font-size:clamp(1.9rem,4vw,2.7rem);margin-bottom:14px}
.story p{color:var(--muted);max-width:52ch;margin:0 0 12px}
.cform{background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 22px 22px;padding:30px;max-width:760px;margin-inline:auto;box-shadow:0 12px 28px var(--shadow)}
.cform h2{font-size:clamp(1.9rem,4vw,2.6rem);margin:6px 0 10px}
.cform .lead{color:var(--muted);margin:0 0 18px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px}
.frow>*{min-width:0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted)}
.fld input,.fld textarea,.fld select{font:400 1rem var(--f-body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.fld textarea{resize:vertical;min-height:72px}
.chk{display:flex;gap:10px;align-items:center;font-size:.95rem;color:var(--ink);font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--btn)}
.sum{font:400 .86rem/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;background:var(--bg);border:1px dashed var(--rose);border-radius:8px;padding:12px;max-height:240px;overflow:auto;margin:0;direction:ltr;text-align:left}
.fine{font-size:.82rem;color:var(--muted);margin:0}
.err{color:var(--rose-deep);font-weight:700}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links .btn{flex:1;min-width:140px;padding:12px 14px}

footer{margin-top:64px;border-top:1px solid var(--line);padding-block:30px 40px;display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;color:var(--muted);font-size:.92rem}
footer b{font:600 1.5rem var(--f-display);color:var(--ink)}
footer a{color:var(--rose-deep);font-weight:700}

/* detail page */
.detail{position:fixed;inset:0;z-index:35;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dtop{padding-block:14px}
.back{background:none;border:0;color:var(--rose-deep);font-weight:700;padding:6px 0;text-align:start}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding-bottom:60px;align-items:start}
.dgrid>*{min-width:0}
.dmain{position:relative;aspect-ratio:1/1;background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 22px 22px;overflow:hidden;display:grid;place-items:center}
.dmain img{width:100%;height:100%;object-fit:cover}
.dmain svg{width:72%;height:auto}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.tb{width:68px;height:68px;border:2px solid var(--line);border-radius:8px;padding:0;overflow:hidden;background:var(--paper)}
.tb img{width:100%;height:100%;object-fit:cover;display:block}
.tb[aria-pressed="true"]{border-color:var(--rose-deep)}
.dinfo h2{font-size:clamp(2rem,4.5vw,3rem);margin:4px 0 6px}
.dprice{font:600 1.8rem var(--f-display);margin:8px 0 12px}
.dinfo .lead{color:var(--muted);margin:0 0 16px}
.grp{margin-bottom:16px}
.grp h4{margin:0 0 8px;font-size:.85rem;font-weight:700;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.92rem}
.opt[aria-pressed="true"]{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--bg)}
.buyrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0 22px}
.qty{display:inline-flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);line-height:1;padding:0}
.qty span{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.facts{border-top:1px dashed var(--line);padding-top:16px;display:grid;gap:16px}
.facts h4{margin:0 0 6px;font:600 1.3rem var(--f-display)}
.facts p{margin:0;color:var(--muted)}
.facts ul{margin:0;padding-inline-start:20px;color:var(--muted)}

/* modal (scent finder) */
.modal{position:fixed;inset:0;z-index:45;background:rgba(40,22,24,.5);display:grid;place-items:center;padding:16px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto}
.qb{padding:6px 20px 22px}
.qb h3{font-size:1.7rem;margin:8px 0 14px}
.qopts{display:grid;gap:10px}
.qopt{background:var(--bg);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 16px;text-align:start;font-weight:700}
.qopt:hover{border-color:var(--rose-deep)}
.qres{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--bg)}
.qres>*{min-width:0}
.qres b{font:600 1.2rem var(--f-display)}
.qstep{font-size:.8rem;color:var(--muted);font-weight:700}

/* cart drawer */
.scrim{position:fixed;inset:0;background:rgba(40,22,24,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(430px,100%);background:var(--paper);z-index:50;transform:translateX(calc(105% * var(--dir)));transition:transform .3s;display:flex;flex-direction:column;
  border-inline-start:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
aside.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:1.9rem}
.x{background:none;border:0;color:var(--ink);font-size:1.6rem;line-height:1;padding:4px 8px}
.db{flex:1;overflow:auto;padding:8px 20px 20px}
.empty{text-align:center;color:var(--muted);padding:48px 12px}
.empty .hand{display:block;font-size:1.8rem;margin-bottom:6px}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}
.line>*{min-width:0}
.thumb{width:64px;height:64px;border-radius:8px;background:var(--bg);display:grid;place-items:center;overflow:hidden;position:relative}
.thumb svg{width:84%}
.thumb img{width:100%;height:100%;object-fit:cover}
.line h4{margin:0;font:600 1.15rem var(--f-display)}
.line small{color:var(--muted);display:block}
.line .qty{margin-top:4px}
.lt{font-variant-numeric:tabular-nums;font-weight:700}
.df{border-top:1px solid var(--line);padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px}
.tot{display:flex;justify-content:space-between;font:600 1.5rem var(--f-display)}
.df .btn{width:100%}
.df .links .btn{width:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:.9rem;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* featured candle */
.feat{display:grid;grid-template-columns:.9fr 1.1fr;gap:32px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 26px 26px;padding:26px;box-shadow:0 14px 32px var(--shadow);position:relative}
.feat>*{min-width:0}
.feat::before{content:"";position:absolute;inset:8px;border:1.5px dashed var(--rose);border-radius:inherit;opacity:.45;pointer-events:none}
.fart{aspect-ratio:1/.9;border-radius:14px;overflow:hidden;display:grid;place-items:center;position:relative;text-decoration:none}
.fart svg{width:70%;height:auto}
.fart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat h2{font-size:clamp(2rem,4.5vw,3rem);margin:4px 0 8px}
.feat .lead{color:var(--muted);margin:0 0 12px}
.fnote{font-family:var(--f-hand);font-size:1.5rem;color:var(--sage-deep);margin:0 0 14px;line-height:1.2}
.featrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

/* galleries */
.lead2{color:var(--muted);max-width:60ch;margin:0 0 20px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gi{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 18px 18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.gi.vid{grid-column:span 2}
.gb{display:block;width:100%;aspect-ratio:1/1;padding:0;border:0;background:var(--chip);cursor:zoom-in}
.gb img{width:100%;height:100%;object-fit:cover;display:block}
.gi video,.gi iframe{width:100%;aspect-ratio:16/10;border:0;background:#000;display:block}
.gi figcaption{padding:10px 14px 12px;font-size:.9rem;color:var(--muted)}
.gi figcaption b{display:block;color:var(--ink);font:600 1.1rem var(--f-display)}

 e_fine_wa:"يفتح واتساب والطلب مكتوب جاهز. إنستغرام لا يسمح بذلك، لذا يتم نسخ طلبك: الصقه في المحادثة وأرسل.", e_fine_ig:"إنستغرام لا يسمح بكتابة الرسالة تلقائيًا، لذا يتم نسخ طلبك: الصقه في المحادثة وأرسل.",
 foot_tag:"شموع مصنوعة يدويًا، البحرين", foot_prices:"الأسعار بالدينار البحريني (د.ب).", foot_conf:"يتم تأكيد الطلبات عبر الرسائل قبل الدفع.", foot_ig:"إنستغرام", wa_chat:"تحدث معنا على واتساب", wa_short:"تواصل"
}};
let lang = document.documentElement.lang === "ar" ? "ar" : "en", CONFIG = {}, built = false;
const $ = id => document.getElementById(id), t = k => (T[lang] && T[lang][k]) || T.en[k] || "";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const waNum = () => String(CONFIG.whatsapp || "").replace(/\D/g, "");
const igH = () => encodeURIComponent(CONFIG.instagram || "anneshop.bh");
function toast(m){ const e = $("toast"); e.textContent = m; e.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("on"), 1900); }
function apply(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(e => { if (e.dataset.t === "e_h1") e.innerHTML = t("e_h1"); else e.textContent = t(e.dataset.t); });
  $("langBtn").textContent = t("lang_btn"); $("fabText").textContent = t("wa_short"); $("waFab").setAttribute("aria-label", t("wa_chat"));
  document.title = (lang === "ar" ? "الأعراس والمناسبات" : "Weddings & events") + " | Anne Shop";
  if (built) buildOut();
}
function reqText(){
  const yes = (id, en) => $(id).checked ? en : null;
  const extras = [yes("eLabel","custom label or logo"), yes("eColor","matching colors"), yes("ePack","gift packaging"), yes("eDeliver","delivery needed")].filter(Boolean).join(", ") || "-";
  return ["Events and bulk request - Anne Shop", "", "For: " + $("eType").value, "Quantity: " + ($("eQty").value || "-"), "Needed by: " + ($("eDate").value || "-"),
    "Company or event: " + ($("eOrg").value.trim() || "-"), "Budget per candle: " + ($("eBudget").value.trim() || "-"), "Extras: " + extras,
    "Ideas: " + ($("eIdeas").value.trim() || "-"), "", "Name: " + $("eName").value.trim(), "Phone: " + $("ePhone").value.trim()].join("\n");
}
function buildOut(){
  const txt = reqText(); $("eSum").textContent = txt;
  const wa = waNum() ? `<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${waNum()}?text=${encodeURIComponent(txt)}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16v11H10l-6 4z"/><path d="M8.5 10.5h7"/></svg> ${esc(t("wa_send"))}</a>` : "";
  const ig = `<a class="btn wa ig igdm" target="_blank" rel="noopener" href="https://ig.me/m/${igH()}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".8" fill="currentColor"/></svg> ${esc(t("ig_send"))}</a>`;
  $("eLinks").innerHTML = wa + ig + `<button class="btn ghost" type="button" id="eCopy">${esc(t("copy"))}</button>`;
  $("eFine").textContent = t(waNum() ? "e_fine_wa" : "e_fine_ig");
}
function copyTxt(txt, ok, bad){ try { navigator.clipboard.writeText(txt).then(ok, bad); } catch(e) { bad(); } }
function selectSum(){ const r = document.createRange(); r.selectNodeContents($("eSum")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
$("eLinks").addEventListener("click", e => {
  if (e.target.closest("#eCopy")) { copyTxt(reqText(), () => toast(t("copied")), () => { selectSum(); toast(t("select_copy")); }); return; }
  if (e.target.closest(".igdm")) {
    const h = $("igHint");
    copyTxt(reqText(), () => { h.textContent = t("ig_hint"); h.hidden = false; }, () => { selectSum(); h.textContent = t("ig_fail"); h.hidden = false; });
  }
});
$("eGo").addEventListener("click", () => {
  const bad = !$("eName").value.trim() || !$("ePhone").value.trim();
  $("eErr").hidden = !bad; if (bad) return;
  try { localStorage.setItem("anneshop-name", $("eName").value.trim().slice(0, 40)); } catch(e) {}
  built = true; buildOut(); $("eOut").hidden = false; $("igHint").hidden = true; $("eOut").scrollIntoView({behavior:"smooth", block:"nearest"});
});
document.querySelectorAll("#request input, #request select, #request textarea").forEach(el => el.addEventListener("input", () => { if (built) buildOut(); }));
function links(){
  $("igLink").href = "https://www.instagram.com/" + igH() + "/"; $("igLink").textContent = "@" + (CONFIG.instagram || "anneshop.bh");
  if (waNum()) { $("waFab").href = "https://wa.me/" + waNum() + "?text=" + encodeURIComponent("Hi Anne, I have a question about an event order."); $("waFab").hidden = false; }
  if (built) buildOut();
}
$("langBtn").addEventListener("click", () => {
  document.documentElement.className = "boot";
  lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("anneshop-lang", lang); } catch(e) {}
  if (lang === "ar" && window.__arFonts) window.__arFonts();
  apply(); requestAnimationFrame(() => requestAnimationFrame(() => { document.documentElement.className = ""; }));
});
try { const n = localStorage.getItem("anneshop-name"); if (n) $("eName").value = n; } catch(e) {}
apply();
fetch("products.json?v=" + Date.now()).then(r => r.ok ? r.json() : null).then(d => { if (d && d.settings) { CONFIG = d.settings; links(); } }).catch(() => {});
requestAnimationFrame(() => requestAnimationFrame(() => { document.documentElement.className = ""; }));
</script>
</body>
