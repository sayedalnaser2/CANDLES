window.__arFonts=function(){if(document.getElementById("arFonts"))return;var k=document.createElement("link");k.id="arFonts";k.rel="stylesheet";k.href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap";document.head.appendChild(k);};
(function(){var l="en";try{l=localStorage.getItem("anneshop-lang")||((navigator.language||"").toLowerCase().indexOf("ar")===0?"ar":"en")}catch(e){}
if(l!=="ar")l="en";var h=document.documentElement;h.lang=l;h.dir=l==="ar"?"rtl":"ltr";h.className="boot";if(l==="ar")window.__arFonts();})();

<style>
:root{
  --bg:#f5e8e2; --paper:#fbf3ee; --ink:#47302f; --muted:#85676a;
  --rose:#c98f91; --rose-deep:#a8656b; --sage:#a9b6a0; --sage-deep:#5f7259;
  --line:#e2cbc4; --btn:#8f525a; --btn-ink:#fff8f4; --chip:#efdcd5; --shadow:rgba(90,50,50,.14); --ann:#dfe5d8; --ann-ink:#34402f;
  --f-display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --f-body:"Karla","Trebuchet MS",system-ui,sans-serif;
  --f-hand:"Caveat","Bradley Hand",cursive;
  --dir:1; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#271c1e; --paper:#33262a; --ink:#f3e4de; --muted:#c3a7a3;
  --rose:#d9a1a3; --rose-deep:#e1a3a6; --sage:#7f9177; --sage-deep:#b2c4a8;
  --line:#4a3739; --btn:#e2aaac; --btn-ink:#2a1d1f; --chip:#3d2d30; --shadow:rgba(0,0,0,.35); --ann:#3a4636; --ann-ink:#e4edd9; color-scheme:dark}}
html[dir="rtl"]{--dir:-1}
html[lang="ar"]{--f-display:"Amiri","Cormorant Garamond",Georgia,serif;--f-body:"Tajawal","Karla",system-ui,sans-serif;--f-hand:"Amiri",serif}

*{box-sizing:border-box}
[hidden]{display:none!important}
.boot *,.boot *::before,.boot *::after{transition:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);
  background-image:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--rose) 14%,transparent),transparent 45%),radial-gradient(circle at 100% 40%,color-mix(in srgb,var(--sage) 16%,transparent),transparent 40%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
img{max-width:100%}
html{-webkit-tap-highlight-color:rgba(168,101,107,.18)}
button,a,input,select,summary,label{touch-action:manipulation}
.detail,.db,.panel,.lb{overscroll-behavior:contain}
.x{min-width:44px;min-height:44px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.12;margin:0;text-wrap:balance}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
.hand{font-family:var(--f-hand);font-size:1.45rem;color:var(--rose-deep);line-height:1.1;margin:0}
.eyebrow{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
html[lang="ar"] .eyebrow,html[lang="ar"] .tag{letter-spacing:0;text-transform:none}

/* announcement */
.ann{background:var(--ann);color:var(--ann-ink);font-size:.92rem}
.annin{display:flex;align-items:center;justify-content:center;gap:12px;padding-block:8px;text-align:center}
.annin a{font-weight:700}
.annin button{background:none;border:0;color:inherit;font-size:1.3rem;line-height:1;padding:2px 6px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none}
.logo b{font:600 1.75rem var(--f-display);letter-spacing:.01em}
.logo span{font:500 1.25rem var(--f-hand);color:var(--rose-deep)}
nav{display:flex;align-items:center;gap:16px}
nav a.lnk{text-decoration:none;font-size:.92rem;color:var(--muted)}
nav a.lnk:hover{color:var(--ink)}
.langbtn{background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:700}
.cartbtn{display:flex;align-items:center;gap:8px;background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:.9rem}
.cartbtn i{font-style:normal;background:var(--btn-ink);color:var(--btn);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.78rem;padding:0 6px}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-block:48px 40px}
.hero>*{min-width:0}
.hero h1{font-size:clamp(2.6rem,6.5vw,4.6rem);margin:12px 0 18px}
.hero h1 em{color:var(--rose-deep);font-weight:500}
.hero p.lead{max-width:46ch;color:var(--muted);font-size:1.08rem;margin:0 0 26px}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-block;background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:13px 26px;font-weight:700;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rose-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.plate{position:relative;aspect-ratio:1/1.05;max-width:440px;width:100%;margin-inline:auto;background:var(--paper);border-radius:46% 46% 8px 8px/38% 38% 8px 8px;
  border:1px solid var(--line);box-shadow:0 18px 40px var(--shadow);display:grid;place-items:center}
.plate::after{content:"";position:absolute;inset:10px;border:1.5px dashed var(--rose);border-radius:inherit;opacity:.55;pointer-events:none}
.plate svg{width:78%;height:auto}
.stamp{position:absolute;inset-inline-end:-6px;bottom:22px;transform:rotate(-9deg);background:var(--sage);color:#26301f;border-radius:50%;width:92px;height:92px;display:grid;place-items:center;text-align:center;
  font:600 .98rem/1.05 var(--f-display);border:2px dashed #26301f55;padding:8px}

.scallop{height:16px;background:radial-gradient(circle at 10px 0,transparent 9px,var(--chip) 9.5px) 0 0/20px 16px repeat-x}
.promise{background:var(--chip);padding-block:18px}
.promise ul{list-style:none;margin:0 auto;padding:0;max-width:1120px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 28px;font-family:var(--f-display);font-size:1.2rem;font-style:italic}
html[lang="ar"] .promise ul{font-style:normal}
.promise li::before{content:"\2766";color:var(--rose-deep);margin-inline-end:9px;font-style:normal}

/* shop */
section{padding-block:56px 12px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
.head h2{font-size:clamp(2rem,4.5vw,3rem)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input,.tools select{font:400 .95rem var(--f-body);color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px}
.tools input{width:min(260px,100%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 16px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.grid>p{grid-column:1/-1;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 22px 22px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .25s,box-shadow .25s}
@media (hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 14px 28px var(--shadow)}}
.art{aspect-ratio:1/.92;display:grid;place-items:center;position:relative;border-bottom:1px solid var(--line);text-decoration:none}
.art svg{width:74%;height:auto}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:12px;inset-inline-start:12px;background:var(--rose-deep);color:var(--btn-ink);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:3px 10px;border-radius:3px;z-index:1}
.info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:1.5rem}
.info h3 a{text-decoration:none}
.notes{color:var(--muted);font-size:.92rem;margin:0}
.size{font-family:var(--f-hand);font-size:1.2rem;color:var(--sage-deep)}
.buy{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:12px}
.price{font:600 1.35rem var(--f-display)}
.add{background:transparent;color:var(--ink);border:1.5px solid var(--rose-deep);border-radius:999px;padding:7px 16px;font-weight:700;font-size:.88rem;text-decoration:none;display:inline-block;white-space:nowrap}
@media (hover:hover){.add:hover{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}}
.add:active{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.add:disabled{opacity:.5;cursor:not-allowed}

/* story + custom */
.story{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px;align-items:center}
.story>*{min-width:0}
.note{background:var(--paper);border:1px solid var(--line);padding:30px 28px;transform:rotate(-1.6deg);box-shadow:0 10px 24px var(--shadow);
  background-image:repeating-linear-gradient(transparent 0 31px,color-mix(in srgb,var(--rose) 28%,transparent) 31px 32px)}
.note p{font-family:var(--f-hand);font-size:1.6rem;line-height:32px;margin:0}
.story h2{font-size:clamp(1.9rem,4vw,2.7rem);margin-bottom:14px}
.story p{color:var(--muted);max-width:52ch;margin:0 0 12px}
.cform{background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 22px 22px;padding:30px;max-width:760px;margin-inline:auto;box-shadow:0 12px 28px var(--shadow)}
.cform h2{font-size:clamp(1.9rem,4vw,2.6rem);margin:6px 0 10px}
.cform .lead{color:var(--muted);margin:0 0 18px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px}
.frow>*{min-width:0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted)}
.fld input,.fld textarea,.fld select{font:400 1rem var(--f-body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.fld textarea{resize:vertical;min-height:72px}
.chk{display:flex;gap:10px;align-items:center;font-size:.95rem;color:var(--ink);font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--btn)}
.sum{font:400 .86rem/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;background:var(--bg);border:1px dashed var(--rose);border-radius:8px;padding:12px;max-height:240px;overflow:auto;margin:0;direction:ltr;text-align:left}
.fine{font-size:.82rem;color:var(--muted);margin:0}
.err{color:var(--rose-deep);font-weight:700}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links .btn{flex:1;min-width:140px;padding:12px 14px}

footer{margin-top:64px;border-top:1px solid var(--line);padding-block:30px 40px;display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;color:var(--muted);font-size:.92rem}
footer b{font:600 1.5rem var(--f-display);color:var(--ink)}
footer a{color:var(--rose-deep);font-weight:700}

/* detail page */
.detail{position:fixed;inset:0;z-index:35;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dtop{padding-block:14px}
.back{background:none;border:0;color:var(--rose-deep);font-weight:700;padding:6px 0;text-align:start}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding-bottom:60px;align-items:start}
.dgrid>*{min-width:0}
.dmain{position:relative;aspect-ratio:1/1;background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 22px 22px;overflow:hidden;display:grid;place-items:center}
.dmain img{width:100%;height:100%;object-fit:cover}
.dmain svg{width:72%;height:auto}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.tb{width:68px;height:68px;border:2px solid var(--line);border-radius:8px;padding:0;overflow:hidden;background:var(--paper)}
.tb img{width:100%;height:100%;object-fit:cover;display:block}
.tb[aria-pressed="true"]{border-color:var(--rose-deep)}
.dinfo h2{font-size:clamp(2rem,4.5vw,3rem);margin:4px 0 6px}
.dprice{font:600 1.8rem var(--f-display);margin:8px 0 12px}
.dinfo .lead{color:var(--muted);margin:0 0 16px}
.grp{margin-bottom:16px}
.grp h4{margin:0 0 8px;font-size:.85rem;font-weight:700;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.92rem}
.opt[aria-pressed="true"]{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--bg)}
.buyrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0 22px}
.qty{display:inline-flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);line-height:1;padding:0}
.qty span{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.facts{border-top:1px dashed var(--line);padding-top:16px;display:grid;gap:16px}
.facts h4{margin:0 0 6px;font:600 1.3rem var(--f-display)}
.facts p{margin:0;color:var(--muted)}
.facts ul{margin:0;padding-inline-start:20px;color:var(--muted)}

/* modal (scent finder) */
.modal{position:fixed;inset:0;z-index:45;background:rgba(40,22,24,.5);display:grid;place-items:center;padding:16px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto}
.qb{padding:6px 20px 22px}
.qb h3{font-size:1.7rem;margin:8px 0 14px}
.qopts{display:grid;gap:10px}
.qopt{background:var(--bg);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 16px;text-align:start;font-weight:700}
.qopt:hover{border-color:var(--rose-deep)}
.qres{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--bg)}
.qres>*{min-width:0}
.qres b{font:600 1.2rem var(--f-display)}
.qstep{font-size:.8rem;color:var(--muted);font-weight:700}

/* cart drawer */
.scrim{position:fixed;inset:0;background:rgba(40,22,24,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(430px,100%);background:var(--paper);z-index:50;transform:translateX(calc(105% * var(--dir)));transition:transform .3s;display:flex;flex-direction:column;
  border-inline-start:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
aside.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:1.9rem}
.x{background:none;border:0;color:var(--ink);font-size:1.6rem;line-height:1;padding:4px 8px}
.db{flex:1;overflow:auto;padding:8px 20px 20px}
.empty{text-align:center;color:var(--muted);padding:48px 12px}
.empty .hand{display:block;font-size:1.8rem;margin-bottom:6px}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}
.line>*{min-width:0}
.thumb{width:64px;height:64px;border-radius:8px;background:var(--bg);display:grid;place-items:center;overflow:hidden;position:relative}
.thumb svg{width:84%}
.thumb img{width:100%;height:100%;object-fit:cover}
.line h4{margin:0;font:600 1.15rem var(--f-display)}
.line small{color:var(--muted);display:block}
.line .qty{margin-top:4px}
.lt{font-variant-numeric:tabular-nums;font-weight:700}
.df{border-top:1px solid var(--line);padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px}
.tot{display:flex;justify-content:space-between;font:600 1.5rem var(--f-display)}
.df .btn{width:100%}
.df .links .btn{width:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:.9rem;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* featured candle */
.feat{display:grid;grid-template-columns:.9fr 1.1fr;gap:32px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 26px 26px;padding:26px;box-shadow:0 14px 32px var(--shadow);position:relative}
.feat>*{min-width:0}
.feat::before{content:"";position:absolute;inset:8px;border:1.5px dashed var(--rose);border-radius:inherit;opacity:.45;pointer-events:none}
.fart{aspect-ratio:1/.9;border-radius:14px;overflow:hidden;display:grid;place-items:center;position:relative;text-decoration:none}
.fart svg{width:70%;height:auto}
.fart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat h2{font-size:clamp(2rem,4.5vw,3rem);margin:4px 0 8px}
.feat .lead{color:var(--muted);margin:0 0 12px}
.fnote{font-family:var(--f-hand);font-size:1.5rem;color:var(--sage-deep);margin:0 0 14px;line-height:1.2}
.featrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

/* galleries */
.lead2{color:var(--muted);max-width:60ch;margin:0 0 20px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gi{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 18px 18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.gi.vid{grid-column:span 2}
.gb{display:block;width:100%;aspect-ratio:1/1;padding:0;border:0;background:var(--chip);cursor:zoom-in}
.gb img{width:100%;height:100%;object-fit:cover;display:block}
.gi video,.gi iframe{width:100%;aspect-ratio:16/10;border:0;background:#000;display:block}
.gi figcaption{padding:10px 14px 12px;font-size:.9rem;color:var(--muted)}
.gi figcaption b{display:block;color:var(--ink);font:600 1.1rem var(--f-display)}

/* ===================== Shop grid ===================== */
function renderChips(){
  const seen = [], rows = [];
  PRODUCTS.forEach(p => { if (p.cat && seen.indexOf(p.cat) < 0) { seen.push(p.cat); rows.push(p); } });
  if (filter !== "All" && seen.indexOf(filter) < 0) filter = "All";
  $("chips").hidden = rows.length < 2;
  $("chips").innerHTML = `<button class="chip" type="button" aria-pressed="${filter==="All"}" data-c="All">${esc(t("all"))}</button>` +
    rows.map(p => `<button class="chip" type="button" aria-pressed="${filter===p.cat}" data-c="${esc(p.cat)}">${esc(L(p,"cat"))}</button>`).join("");
}
function visible(){
  let list = PRODUCTS.filter(p => filter === "All" || p.cat === filter);
  const s = q.trim().toLowerCase();
  if (s) list = list.filter(p => [p.name,p.name_ar,p.notes,p.notes_ar,p.cat,p.cat_ar,p.size,p.size_ar,(p.families||[]).join(" ")].join(" ").toLowerCase().indexOf(s) >= 0);
  if (sort === "low") list = list.slice().sort((a,b) => minPrice(a) - minPrice(b));
  else if (sort === "high") list = list.slice().sort((a,b) => minPrice(b) - minPrice(a));
  else if (sort === "new") list = list.slice().sort((a,b) => String(b.added || "2026-01-01").localeCompare(String(a.added || "2026-01-01")));
  return list;
}
function cardHTML(p){
  const href = "#candle-" + encodeURIComponent(p.id);
  const opts = groups(p).length > 0 || !!p.personalize;
  const price = (hasRange(p) ? t("from") + " " : "") + fmt(minPrice(p));
  const tag = p.soldOut ? t("sold") : L(p,"tag");
  const action = p.soldOut ? `<a class="add" href="${href}">${esc(t("notify_short"))}</a>`
    : opts ? `<a class="add" href="${href}">${esc(t("options"))}</a>`
    : `<button class="add" type="button" data-add="${esc(p.id)}">${esc(t("add"))}</button>`;
  return `<article class="card">
    <a class="art" href="${href}" aria-label="${esc(L(p,"name"))}" style="background:color-mix(in srgb, ${colr(p.c1,"#f3e3df")} 22%, var(--paper))">${tag ? `<span class="tag">${esc(tag)}</span>` : ""}${art(p)}</a>
    <div class="info"><span class="size">${esc(L(p,"size"))}</span><h3><a href="${href}">${esc(L(p,"name"))}</a></h3><p class="notes">${esc(L(p,"notes"))}</p>
      <div class="buy"><span class="price">${esc(price)}</span>${action}</div></div></article>`;
}
function renderGrid(){
  if (loadFailed) { $("grid").innerHTML = `<p>${esc(t("loading_err"))}</p>`; return; }

/* ---- Behind the scenes + customer photos ---- */
const isImg = it => !!it && (it.type || "image") === "image" && /^(images\/|https:\/\/)[^\s"'<>]+$/.test(it.src || "");
const isVid = it => !!it && it.type === "video" && /^(videos\/|https:\/\/)[^\s"'<>]+$/.test(it.src || "");
const ytId = u => { const m = /(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/))([\w-]{11})/.exec(u || ""); return m ? m[1] : ""; };
const isYt = it => !!it && it.type === "youtube" && !!ytId(it.src);
const imgSet = name => (name === "behind" ? (BEHIND.items || []) : CUSTOMER).filter(isImg);
function figHTML(it, setName, idx){
  const cap = L(it, "caption"), who = it.who ? "— " + it.who : "";
  const fc = (cap || who) ? `<figcaption>${cap ? `<b>${esc(cap)}</b>` : ""}${who ? esc(who) : ""}</figcaption>` : "";
  if (isVid(it)) return `<figure class="gi vid"><video controls playsinline preload="metadata" src="${esc(it.src)}"></video>${fc}</figure>`;
  if (isYt(it)) return `<figure class="gi vid"><iframe src="https://www.youtube-nocookie.com/embed/${ytId(it.src)}" title="${esc(cap || "Video")}" loading="lazy" allow="encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>${fc}</figure>`;
  return `<figure class="gi"><button class="gb" type="button" data-lb="${setName}" data-i="${idx}" aria-label="${esc(cap || "Photo")}"><img src="${esc(it.src)}" alt="${esc(cap)}" loading="lazy"></button>${fc}</figure>`;
}
function renderGalleries(){
  const bi = (BEHIND.items || []).filter(it => isImg(it) || isVid(it) || isYt(it)), bImgs = imgSet("behind"), ci = imgSet("cust");
  $("behind").hidden = !bi.length;
  if (bi.length) {
    $("bhTitle").textContent = L(BEHIND, "title") || t("bh_title");
    const tx = L(BEHIND, "text"); $("bhText").textContent = tx; $("bhText").hidden = !tx;
    $("bhGrid").innerHTML = bi.map(it => figHTML(it, "behind", bImgs.indexOf(it))).join("");
  }
  $("photos").hidden = !ci.length;

}
let lb = {set:[], i:0};
function lbShow(){
  const it = lb.set[lb.i]; if (!it) return;
  $("lbImg").src = it.src; $("lbImg").alt = L(it, "caption");
  $("lbCap").textContent = [L(it, "caption"), it.who ? "— " + it.who : ""].filter(Boolean).join(" ");

}
function lbOpen(set, i){ lb = {set:set, i:i}; lbShow(); $("lb").hidden = false; }
function lbClose(){ $("lb").hidden = true; }
function lbStep(d){ lb.i = (lb.i + d + lb.set.length) % lb.set.length; lbShow(); }
document.addEventListener("click", e => { const g = e.target.closest("[data-lb]"); if (g) lbOpen(imgSet(g.dataset.lb), +g.dataset.i); });
$("lbClose").addEventListener("click", lbClose);
$("lbPrev").addEventListener("click", () => lbStep(-1)); $("lbNext").addEventListener("click", () => lbStep(1));
(function(){ /* swipe left/right in the photo viewer */
  let x0 = null, y0 = 0;
  $("lb").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  $("lb").addEventListener("touchend", e => {
    if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && lb && lb.set.length > 1) lbStep((dx < 0 ? 1 : -1) * (lang === "ar" ? -1 : 1));

/* ===================== Cart ===================== */
const lineKey = l => l.id + "|" + (l.sel || []).join(".") + "|" + (l.note || "");
function variantText(p, sel, en){
  return groups(p).map((g,i) => { const c = g.choices[(sel && sel[i]) || 0] || g.choices[0]; return (en ? g.name : L(g,"name")) + ": " + (en ? c.label : L(c,"label")); }).join(en ? "; " : " · ");
}
function addLine(id, sel, note, qty){
  const p = byId(id); if (!p || p.soldOut) return;
  const k = lineKey({id:id, sel:sel, note:note}), ex = cart.find(l => lineKey(l) === k);
  if (ex) ex.qty = Math.min(99, ex.qty + qty); else cart.push({id:id, sel:sel, note:note, qty:qty});
  saveCart(); renderCart(); track("add/" + id, p.name);
  toast(L(p,"name") + " – " + t("added"));
}
const count = () => cart.reduce((a,l) => a + l.qty, 0);
const subtotal = () => cart.reduce((s,l) => { const p = byId(l.id); return s + (p ? unit(p, l.sel) * l.qty : 0); }, 0);
const giftFee = () => form.gift ? (+CONFIG.giftWrapFee || 0) : 0;
const grand = () => subtotal() + giftFee();

function orderText(){
  const lines = cart.map(l => { const p = byId(l.id), v = variantText(p, l.sel, true), n = l.note ? 'Note: "' + l.note + '"' : "", extra = [v, n].filter(Boolean).join("; ");
    return l.qty + " x " + p.name + (extra ? " (" + extra + ")" : "") + " - " + fmtEn(unit(p, l.sel) * l.qty); });
  const out = ["New order for Anne Shop", "", ...lines];
  if (giftFee() > 0) out.push("1 x Gift wrap - " + fmtEn(giftFee()));
  out.push("", "Total: " + fmtEn(grand()), "", "Name: " + form.name, "Phone: " + form.phone, "Area: " + (form.area || "-"), "Notes: " + (form.notes || "-"));
  if (form.gift) out.push("", "This is a gift. Gift message: " + (form.giftMsg || "-"));
  return out.join("\n");
}
function renderCart(){
  $("count").textContent = count();
  const body = $("dBody"), foot = $("dFoot");
  if (step === "cart") {
    $("dTitle").textContent = t("cart_title");
    if (!cart.length) {
      body.innerHTML = `<div class="empty"><span class="hand">${esc(t("cart_empty_h"))}</span>${esc(t("cart_empty"))}</div>`;
      foot.innerHTML = `<button class="btn" type="button" data-go="shop">${esc(t("browse"))}</button>`; return;
    }
    body.innerHTML = cart.map((l,i) => { const p = byId(l.id), v = variantText(p, l.sel, false); return `
      <div class="line"><div class="thumb">${art(p)}</div>
        <div><h4>${esc(L(p,"name"))}</h4>${v ? `<small>${esc(v)}</small>` : ""}${l.note ? `<small>“${esc(l.note)}”</small>` : ""}<small>${esc(fmt(unit(p,l.sel)))} ${esc(t("each"))}</small>
          <div class="qty"><button type="button" data-d="-1" data-i="${i}" aria-label="−">−</button><span>${l.qty}</span><button type="button" data-d="1" data-i="${i}" aria-label="+">+</button></div></div>
        <div class="lt">${esc(fmt(unit(p,l.sel) * l.qty))}</div></div>`; }).join("");
    foot.innerHTML = `<div class="tot"><span>${esc(t("total"))}</span><span>${esc(fmt(subtotal()))}</span></div><p class="fine">${esc(t("cart_fine"))}</p><button class="btn" type="button" data-go="details">${esc(t("checkout"))}</button>`;
  } else if (step === "details") {
    $("dTitle").textContent = t("d_title");
    const fee = +CONFIG.giftWrapFee || 0;
    body.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px;padding-top:14px">
      <button class="back" type="button" data-go="cart">${esc(t("d_back"))}</button>
      <label class="fld" for="fName">${esc(t("f_name"))}<input id="fName" autocomplete="name"></label>
      <label class="fld" for="fPhone">${esc(t("f_phone"))}<input id="fPhone" inputmode="tel" autocomplete="tel"></label>
      <label class="fld" for="fArea">${esc(t("f_area"))}<input id="fArea" placeholder="${esc(t("f_area_ph"))}"></label>
      <label class="fld" for="fNotes">${esc(t("f_notes"))}<textarea id="fNotes"></textarea></label>
      <label class="chk" for="fGift"><input type="checkbox" id="fGift"> <span>${esc(t("f_gift"))}${fee > 0 ? " (+" + esc(fmt(fee)) + " " + esc(t("f_wrap")) + ")" : ""}</span></label>
      <label class="fld" for="fGiftMsg" id="giftWrap" hidden>${esc(t("f_giftmsg"))}<textarea id="fGiftMsg"></textarea></label>
      <p class="fine err" id="err" hidden>${esc(t("f_err"))}</p></div>`;
    $("fName").value = form.name; $("fPhone").value = form.phone; $("fArea").value = form.area; $("fNotes").value = form.notes;
    $("fGift").checked = form.gift; $("fGiftMsg").value = form.giftMsg; $("giftWrap").hidden = !form.gift;
    foot.innerHTML = `<div class="tot"><span>${esc(t("total"))}</span><span id="dTot">${esc(fmt(grand()))}</span></div><button class="btn" type="button" data-go="review">${esc(t("review"))}</button>`;
  } else {
    $("dTitle").textContent = t("r_title");
    body.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px;padding-top:14px">
      <button class="back" type="button" data-go="details">${esc(t("r_back"))}</button>
      <p class="fine">${esc(t("r_intro"))}</p><pre class="sum" id="sum"></pre></div>`;
    $("sum").textContent = orderText();
    const wa = CONFIG.whatsapp ? `<a class="btn" target="_blank" rel="noopener" href="${esc(waUrl(orderText()))}">${esc(t("whatsapp"))}</a>` : "";
    foot.innerHTML = `<div class="links"><button class="btn" type="button" id="copy">${esc(t("copy"))}</button>${wa}<a class="btn ghost" target="_blank" rel="noopener" href="${esc(igUrl())}">${esc(t("open_ig"))}</a></div><p class="fine">${esc(t("r_fine"))}</p>`;
  }
}
function copyText(text, pre){
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(t("copied"))).catch(() => {
    const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(t("select_copy")); });
}
$("dBody").addEventListener("input", e => {
  const m = {fName:"name", fPhone:"phone", fArea:"area", fNotes:"notes", fGiftMsg:"giftMsg"}[e.target.id]; if (m) form[m] = e.target.value;
});
$("dBody").addEventListener("change", e => {
  if (e.target.id === "fGift") { form.gift = e.target.checked; $("giftWrap").hidden = !form.gift; $("dTot").textContent = fmt(grand()); }
});
function onDrawer(e){
  const qb = e.target.closest("[data-d]");
  if (qb) { const l = cart[+qb.dataset.i]; if (l) { l.qty += +qb.dataset.d; if (l.qty <= 0) cart.splice(+qb.dataset.i, 1); saveCart(); renderCart(); } return; }
  const g = e.target.closest("[data-go]"); if (!g) return;
  const to = g.dataset.go;
  if (to === "shop") { closeCart(); location.hash = "shop"; return; }
  if (to === "review" && (!form.name.trim() || !form.phone.trim())) { $("err").hidden = false; return; }
  step = to; renderCart();
}
$("dBody").addEventListener("click", onDrawer);
$("dFoot").addEventListener("click", e => { if (e.target.id === "copy") { copyText(orderText(), $("sum")); track("order/copy", "Order copied"); return; } onDrawer(e); });
function openCart(){ step = "cart"; renderCart(); $("drawer").classList.add("on"); $("scrim").classList.add("on"); $("drawer").setAttribute("aria-hidden","false"); }
function closeCart(){ $("drawer").classList.remove("on"); $("scrim").classList.remove("on"); $("drawer").setAttribute("aria-hidden","true"); }
$("openCart").addEventListener("click", openCart); $("closeCart").addEventListener("click", closeCart); $("scrim").addEventListener("click", closeCart);

/* ===================== Product page ===================== */
function openDetail(p){
  detailState = {p:p, sel:groups(p).map(() => 0), qty:1, note:""};
  $("detail").hidden = false; document.body.style.overflow = "hidden";
  renderDetail(); $("detail").scrollTop = 0; updateFab();
  track("candle/" + p.id, p.name);
}
function closeDetail(){ if (!detailState && $("detail").hidden) return; detailState = null; $("detail").hidden = true; document.body.style.overflow = ""; updateFab(); }
function renderDetail(){
  const st = detailState, p = st.p, G = groups(p), im = imgs(p);
  const main = im.length ? `<div class="slides" id="dSlides">${im.map(s => `<img src="${esc(s)}" alt="${esc(L(p,"name"))}" loading="lazy" draggable="false">`).join("")}</div>` : artSvg(p);
  const thumbs = im.length > 1 ? `<div class="thumbs">${im.map((s,i) => `<button class="tb" type="button" data-act="img" data-i="${i}" aria-pressed="${i===0}"><img src="${esc(s)}" alt=""></button>`).join("")}</div>` : "";
  const care = L(p,"care").split("\n").map(x => x.trim()).filter(Boolean);
  const tag = p.soldOut ? t("sold") : L(p,"tag");
  const grp = G.map((g,gi) => `<div class="grp"><h4>${esc(L(g,"name"))}</h4><div class="opts">${g.choices.map((c,ci) =>
    `<button class="opt" type="button" data-act="opt" data-g="${gi}" data-c="${ci}" aria-pressed="${st.sel[gi]===ci}">${esc(L(c,"label"))}${addOf(c) ? " (" + (addOf(c) > 0 ? "+" : "−") + esc(fmt(Math.abs(addOf(c)))) + ")" : ""}</button>`).join("")}</div></div>`).join("");
  $("detailBody").innerHTML = `<div class="dgrid">
    <div><div class="dmain" style="background:color-mix(in srgb, ${colr(p.c1,"#f3e3df")} 22%, var(--paper))">${main}</div>${thumbs}</div>
    <div class="dinfo">
      ${tag ? `<p class="eyebrow">${esc(tag)}</p>` : `<p class="eyebrow">${esc(L(p,"cat"))}</p>`}
      <h2>${esc(L(p,"name"))}</h2><span class="size">${esc(L(p,"size"))}</span>
      <div class="dprice" id="dPrice">${esc(fmt(unit(p, st.sel)))}</div>
      <p class="lead">${esc(L(p,"notes"))}</p>
      ${grp}
      ${p.personalize ? `<div class="grp"><label class="fld" for="dNote">${esc(t("personalize"))}<input id="dNote" maxlength="80" autocomplete="off"></label></div>` : ""}
      <div class="buyrow">
        ${p.soldOut ? "" : `<span class="bprice" id="dPrice2">${esc(fmt(unit(p, st.sel)))}</span>`}
        ${p.soldOut ?`<button class="btn" type="button" data-act="notify">${esc(t("notify"))}</button>` : `<div class="qty"><button type="button" data-act="q" data-d="-1" aria-label="−">−</button><span id="dQty">1</span><button type="button" data-act="q" data-d="1" aria-label="+">+</button></div>
        <button class="btn" type="button" data-act="add">${esc(t("add"))}</button>`}
      </div>
      ${p.soldOut ? `<div class="notify" id="notifyBox" hidden><p class="fine">${esc(t("notify_intro"))}</p>
        <label class="fld" for="nName">${esc(t("notify_name"))}<input id="nName" autocomplete="name"></label><pre class="sum" id="nSum"></pre><div class="links" id="nLinks"></div></div>` : ""}
      <div class="share"><span class="fine">${esc(t("share"))}</span>
        <a class="btn ghost sm" data-act="sharewa" target="_blank" rel="noopener" href="${esc(shareWa(p))}">${esc(t("share_wa"))}</a>
        <button class="btn ghost sm" type="button" data-act="copylink">${esc(t("copy_link"))}</button></div>
      <div class="facts">
        ${L(p,"burn") ? `<div><h4>${esc(t("burn"))}</h4><p>${esc(L(p,"burn"))}</p></div>` : ""}
        ${care.length ? `<div><h4>${esc(t("care"))}</h4><ul>${care.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
      </div>
    </div></div>`;
}
const shareUrl = p => location.origin + location.pathname + "#candle-" + encodeURIComponent(p.id);
const shareWa = p => "https://wa.me/?text=" + encodeURIComponent(L(p, "name") + " - Anne Shop\n" + shareUrl(p));
function copyPlain(text){
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(t("link_copied"))).catch(() => {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(t("link_copied")); } catch(e) { toast(text); } ta.remove(); });
}
function notifyText(){ const n = ($("nName") && $("nName").value.trim()) || ""; return "Hi Anne, please let me know when " + detailState.p.name + " is back in stock." + (n ? " Name: " + n : ""); }
function updateNotify(){
  if (!detailState || !$("notifyBox")) return;
  const txt = notifyText(); $("nSum").textContent = txt;
  const wa = CONFIG.whatsapp ? `<a class="btn" target="_blank" rel="noopener" href="${esc(waUrl(txt))}">${esc(t("whatsapp"))}</a>` : "";
  $("nLinks").innerHTML = `<button class="btn" type="button" id="nCopy">${esc(t("copy"))}</button>${wa}<a class="btn ghost" target="_blank" rel="noopener" href="${esc(igUrl())}">${esc(t("open_ig"))}</a>`;
}
$("detailBody").addEventListener("click", e => {
  if (e.target.id === "nCopy" && detailState) { copyText(notifyText(), $("nSum")); track("notify/copy", detailState.p.name); return; }
  const b = e.target.closest("[data-act]"); if (!b || !detailState) return;
  const st = detailState, a = b.dataset.act;
  if (a === "notify") { const box = $("notifyBox"); box.hidden = !box.hidden; updateNotify(); track("notify/open", st.p.name); }
  else if (a === "copylink") { copyPlain(shareUrl(st.p)); track("share/copy", st.p.name); }
  else if (a === "sharewa") { track("share/whatsapp", st.p.name); }
  else if (a === "img") { const s = $("dSlides"); if (s && s.children[+b.dataset.i]) s.children[+b.dataset.i].scrollIntoView({behavior: "smooth", inline: "start", block: "nearest"}); }
  else if (a === "opt") { st.sel[+b.dataset.g] = +b.dataset.c; b.parentNode.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", String(x === b))); $("dPrice").textContent = fmt(unit(st.p, st.sel)); if ($("dPrice2")) $("dPrice2").textContent = $("dPrice").textContent; }
  else if (a === "q") { st.qty = Math.max(1, Math.min(99, st.qty + +b.dataset.d)); $("dQty").textContent = st.qty; }
  else if (a === "add") addLine(st.p.id, st.sel.slice(), st.note.trim(), st.qty);
});
$("detailBody").addEventListener("input", e => {
  if (!detailState) return;
  if (e.target.id === "dNote") detailState.note = e.target.value;
  if (e.target.id === "nName") updateNotify();
});
$("detailBody").addEventListener("scroll", e => {
  const s = e.target; if (s.id !== "dSlides") return;
  const i = Math.round(Math.abs(s.scrollLeft) / (s.clientWidth || 1));
  $("detailBody").querySelectorAll(".tb").forEach((x, k) => x.setAttribute("aria-pressed", String(k === i)));
}, true);
$("dBack").addEventListener("click", () => { location.hash = "shop"; route(); });
function route(){
  const m = /^#candle-(.+)$/.exec(location.hash);
  if (m) { let id = m[1]; try { id = decodeURIComponent(id); } catch(e) {} const p = byId(id); if (p) { if (!detailState || detailState.p !== p) openDetail(p); return; } }
  closeDetail();
}
window.addEventListener("hashchange", route);

/* ===================== Scent finder ===================== */
function openQuiz(){ quiz = {step:0, fam:null, budget:null}; $("quiz").hidden = false; renderQuiz(); track("quiz/open", "Scent finder"); }
function closeQuiz(){ $("quiz").hidden = true; }
function renderQuiz(){
  const b = $("qBody");
  if (quiz.step === 0) {
    b.innerHTML = `<p class="qstep">${esc(t("question"))} 1/3</p><h3>${esc(t("q1"))}</h3><div class="qopts">${FAMILIES.map(f => `<button class="qopt" type="button" data-fam="${f}">${esc(t("fam_" + f))}</button>`).join("")}</div>`;
  } else if (quiz.step === 1) {
    b.innerHTML = `<p class="qstep">${esc(t("question"))} 2/3</p><h3>${esc(t("q2"))}</h3><div class="qopts">${[["b1",4],["b2",6],["b3",999]].map(x => `<button class="qopt" type="button" data-budget="${x[1]}">${esc(t(x[0]))}</button>`).join("")}</div>`;
  } else if (quiz.step === 2) {
    b.innerHTML = `<p class="qstep">${esc(t("question"))} 3/3</p><h3>${esc(t("q3"))}</h3><div class="qopts"><button class="qopt" type="button" data-gift="1">${esc(t("yes"))}</button><button class="qopt" type="button" data-gift="0">${esc(t("no"))}</button></div>`;
  } else {
    const scored = PRODUCTS.filter(p => !p.soldOut).map(p => ({p:p, s:((p.families||[]).indexOf(quiz.fam) >= 0 ? 3 : 0) + (minPrice(p) <= quiz.budget ? 1 : -5) + (quiz.gift && p.giftable ? 2 : 0)}));
    scored.sort((a,b2) => b2.s - a.s);
    let top = scored.filter(x => x.s > 0).slice(0,3), none = false;
    if (!top.length) { top = scored.slice(0,3); none = true; }
    b.innerHTML = `<h3>${esc(t("q_result"))}</h3>${none ? `<p class="fine" style="margin-bottom:12px">${esc(t("q_none"))}</p>` : ""}` +
      top.map(x => `<a class="qres" href="#candle-${encodeURIComponent(x.p.id)}"><span class="thumb">${art(x.p)}</span><span><b>${esc(L(x.p,"name"))}</b><br><small class="fine">${esc(L(x.p,"notes"))}</small></span><span class="price">${esc(fmt(minPrice(x.p)))}</span></a>`).join("") +
      `<p style="margin:14px 0 0"><button class="btn ghost" type="button" id="qAgain">${esc(t("q_again"))}</button></p>`;
  }
}
$("qBody").addEventListener("click", e => {
  const f = e.target.closest("[data-fam]"), bu = e.target.closest("[data-budget]"), gi = e.target.closest("[data-gift]");
  if (f) { quiz.fam = f.dataset.fam; quiz.step = 1; renderQuiz(); }
  else if (bu) { quiz.budget = +bu.dataset.budget; quiz.step = 2; renderQuiz(); }
  else if (gi) { quiz.gift = gi.dataset.gift === "1"; quiz.step = 3; renderQuiz(); track("quiz/done", "Scent finder result"); }
  else if (e.target.id === "qAgain") { quiz = {step:0, fam:null, budget:null}; renderQuiz(); }
  else if (e.target.closest("a.qres")) closeQuiz();
});
$("findScent").addEventListener("click", openQuiz);
$("qClose").addEventListener("click", closeQuiz);
$("quiz").addEventListener("click", e => { if (e.target === $("quiz")) closeQuiz(); });

/* ===================== Custom order form ===================== */
function customText(){
  return ["Custom order request - Anne Shop", "", "Occasion: " + $("cOcc").value, "Quantity: " + ($("cQty").value || "-"), "Needed by: " + ($("cDate").value || "-"),
    "Ideas: " + ($("cIdeas").value.trim() || "-"), "", "Name: " + $("cName").value.trim(), "Phone: " + $("cPhone").value.trim()].join("\n");
}
function buildCustomOut(){
  const txt = customText(); $("cSum").textContent = txt;
  const wa = CONFIG.whatsapp ? `<a class="btn" target="_blank" rel="noopener" href="${esc(waUrl(txt))}">${esc(t("whatsapp"))}</a>` : "";
  $("cLinks").innerHTML = `<button class="btn" type="button" id="cCopy">${esc(t("copy"))}</button>${wa}<a class="btn ghost" target="_blank" rel="noopener" href="${esc(igUrl())}">${esc(t("open_ig"))}</a>`;
}
$("cGo").addEventListener("click", () => {
  const bad = !$("cName").value.trim() || !$("cPhone").value.trim();
  $("cErr").hidden = !bad; if (bad) return;
  buildCustomOut(); $("cOut").hidden = false; track("custom/prepare", "Custom order prepared");
});
$("cLinks").addEventListener("click", e => { if (e.target.id === "cCopy") copyText(customText(), $("cSum")); });

/* ===================== Wiring ===================== */
$("grid").addEventListener("click", e => { const b = e.target.closest("[data-add]"); if (b) addLine(b.dataset.add, [], "", 1); });
$("chips").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; filter = b.dataset.c; renderChips(); renderGrid(); });
$("search").addEventListener("input", e => { q = e.target.value; renderGrid(); });
$("sort").addEventListener("change", e => { sort = e.target.value; renderGrid(); });
$("langBtn").addEventListener("click", () => setLang(lang === "ar" ? "en" : "ar"));
$("annX").addEventListener("click", () => { try { sessionStorage.setItem("anneshop-ann", (lang === "ar" && CONFIG.announcement.text_ar) ? CONFIG.announcement.text_ar : CONFIG.announcement.text); } catch(e) {} $("annBar").hidden = true; });
document.addEventListener("keydown", e => {
  if (!$("lb").hidden) { if (e.key === "Escape") lbClose(); else if (e.key === "ArrowRight") lbStep(lang === "ar" ? -1 : 1); else if (e.key === "ArrowLeft") lbStep(lang === "ar" ? 1 : -1); return; }
  if (e.key !== "Escape") return;
  if (!$("quiz").hidden) closeQuiz(); else if ($("drawer").classList.contains("on")) closeCart(); else if (detailState) { location.hash = "shop"; route(); }
});

/* ===================== Load products.json (edited from admin.html) ===================== */
async function loadData(){
  try {
    const r = await fetch("products.json?v=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error("status " + r.status);
    const d = await r.json();
    PRODUCTS = Array.isArray(d.products) ? d.products.filter(p => p && p.id) : [];
    if (d.settings) CONFIG = Object.assign({}, CONFIG, d.settings, {announcement:Object.assign({}, CONFIG.announcement, d.settings.announcement || {})});
    if (d.behind && typeof d.behind === "object") BEHIND = Object.assign({}, BEHIND, d.behind, {items:Array.isArray(d.behind.items) ? d.behind.items : []});
    if (Array.isArray(d.customerPhotos)) CUSTOMER = d.customerPhotos;
  } catch(e) { loadFailed = true; }
}
function loadStats(){
  const code = String(CONFIG.goatcounter || "").trim();
  if (!/^[a-z0-9-]{2,40}$/i.test(code)) return;
  const s = document.createElement("script"); s.async = true;
  s.setAttribute("data-goatcounter", "https://" + code + ".goatcounter.com/count");
  s.src = "https://gc.zgo.at/count.js"; document.head.appendChild(s);
}
function init(){
  if (!loadFailed) {
    cart = cart.filter(l => l && byId(l.id) && l.qty > 0).map(l => { const p = byId(l.id), G = groups(p);
      return {id:l.id, qty:Math.min(99, l.qty|0), note:String(l.note || ""), sel:G.map((g,i) => (l.sel && l.sel[i] >= 0 && l.sel[i] < g.choices.length) ? l.sel[i] : 0)}; });
    saveCart();
  } else cart = [];
  applyStatic();
  $("heroArt").insertAdjacentHTML("afterbegin", artSvg(PRODUCTS[0] || {type:"cup", c1:"#f3e3df", c2:"#e7b9bb", c3:"#c98f91"}));
  $("igLink").href = igUrl(); $("igLink").textContent = "@" + (CONFIG.instagram || "anneshop.bh");
  renderAll(); loadStats(); route(); quiet();
}
loadData().then(init);
</script>
