<style>
:root{
  --bg:#f5e8e2; --paper:#fbf3ee; --ink:#47302f; --muted:#7e6164;
  --rose:#c98f91; --rose-deep:#97565b; --sage:#a9b6a0; --sage-deep:#5b6d55;
  --line:#e2cbc4; --btn:#8f525a; --btn-ink:#fff8f4; --chip:#efdcd5; --shadow:rgba(90,50,50,.14); --ann:#dfe5d8; --ann-ink:#34402f;
  --f-display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --f-body:"Karla","Trebuchet MS",system-ui,sans-serif;
  --f-hand:"Caveat","Bradley Hand",cursive;
  --dir:1; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#271c1e; --paper:#33262a; --ink:#f3e4de; --muted:#c3a7a3;
  --rose:#d9a1a3; --rose-deep:#e1a3a6; --sage:#7f9177; --sage-deep:#b2c4a8;
  --line:#4a3739; --btn:#e2aaac; --btn-ink:#2a1d1f; --chip:#3d2d30; --shadow:rgba(0,0,0,.35); --ann:#3a4636; --ann-ink:#e4edd9; color-scheme:dark}}
html[dir="rtl"]{--dir:-1}
html[lang="ar"]{--f-display:"Amiri","Cormorant Garamond",Georgia,serif;--f-body:"Tajawal","Karla",system-ui,sans-serif;--f-hand:"Amiri",serif}

*{box-sizing:border-box}
[hidden]{display:none!important}
.boot *,.boot *::before,.boot *::after{transition:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);
  background-image:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--rose) 14%,transparent),transparent 45%),radial-gradient(circle at 100% 40%,color-mix(in srgb,var(--sage) 16%,transparent),transparent 40%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
img{max-width:100%}
html{-webkit-tap-highlight-color:rgba(168,101,107,.18)}
button,a,input,select,summary,label{touch-action:manipulation}
.detail,.db,.panel,.lb{overscroll-behavior:contain}
.x{min-width:44px;min-height:44px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.12;margin:0;text-wrap:balance}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
.hand{font-family:var(--f-hand);font-size:1.45rem;color:var(--rose-deep);line-height:1.1;margin:0}
.eyebrow{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
html[lang="ar"] .eyebrow,html[lang="ar"] .tag{letter-spacing:0;text-transform:none}

/* announcement */
.ann{background:var(--ann);color:var(--ann-ink);font-size:.92rem}
.annin{display:flex;align-items:center;justify-content:center;gap:12px;padding-block:8px;text-align:center}
.annin a{font-weight:700}
.annin button{background:none;border:0;color:inherit;font-size:1.3rem;line-height:1;padding:2px 6px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none}
.logo b{font:600 1.75rem var(--f-display);letter-spacing:.01em}
.logo span{font:500 1.25rem var(--f-hand);color:var(--rose-deep)}
nav{display:flex;align-items:center;gap:16px}
nav a.lnk{text-decoration:none;font-size:.92rem;color:var(--muted)}
nav a.lnk:hover{color:var(--ink)}
.langbtn{background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:700}
.cartbtn{display:flex;align-items:center;gap:8px;background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:.9rem}
.cartbtn i{font-style:normal;background:var(--btn-ink);color:var(--btn);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.78rem;padding:0 6px}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-block:48px 40px}
.hero>*{min-width:0}
.hero h1{font-size:clamp(2.6rem,6.5vw,4.6rem);margin:12px 0 18px}
.hero h1 em{color:var(--rose-deep);font-weight:500}
.hero p.lead{max-width:46ch;color:var(--muted);font-size:1.08rem;margin:0 0 26px}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-block;background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:13px 26px;font-weight:700;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rose-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.plate{position:relative;aspect-ratio:1/1.05;max-width:440px;width:100%;margin-inline:auto;background:var(--paper);border-radius:46% 46% 8px 8px/38% 38% 8px 8px;
  border:1px solid var(--line);box-shadow:0 18px 40px var(--shadow);display:grid;place-items:center}
.plate::after{content:"";position:absolute;inset:10px;border:1.5px dashed var(--rose);border-radius:inherit;opacity:.55;pointer-events:none}
.plate svg{width:78%;height:auto}
.stamp{position:absolute;inset-inline-end:-6px;bottom:22px;transform:rotate(-9deg);background:var(--sage);color:#161d12;border-radius:50%;width:92px;height:92px;display:grid;place-items:center;text-align:center;
  font:600 .98rem/1.05 var(--f-display);border:2px dashed #26301f55;padding:8px}

.scallop{height:16px;background:radial-gradient(circle at 10px 0,transparent 9px,var(--chip) 9.5px) 0 0/20px 16px repeat-x}
.promise{background:var(--chip);padding-block:18px}
.promise ul{list-style:none;margin:0 auto;padding:0;max-width:1120px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 28px;font-family:var(--f-display);font-size:1.2rem;font-style:italic}
html[lang="ar"] .promise ul{font-style:normal}
.promise li::before{content:"\2766";color:var(--rose-deep);margin-inline-end:9px;font-style:normal}

/* shop */
section{padding-block:56px 12px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
.head h2{font-size:clamp(2rem,4.5vw,3rem)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input,.tools select{font:400 .95rem var(--f-body);color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px}
.tools input{width:min(260px,100%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 16px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.grid>p{grid-column:1/-1;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 22px 22px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .25s,box-shadow .25s}
@media (hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 14px 28px var(--shadow)}}
.art{aspect-ratio:1/.92;display:grid;place-items:center;position:relative;border-bottom:1px solid var(--line);text-decoration:none}
.art svg{width:74%;height:auto}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:12px;inset-inline-start:12px;background:var(--rose-deep);color:var(--btn-ink);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:3px 10px;border-radius:3px;z-index:1}
.info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:1.5rem}
.info h3 a{text-decoration:none}
.notes{color:var(--muted);font-size:.92rem;margin:0}
.size{font-family:var(--f-hand);font-size:1.2rem;color:var(--sage-deep)}
.buy{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:12px}
.price{font:600 1.35rem var(--f-display)}
.add{background:transparent;color:var(--ink);border:1.5px solid var(--rose-deep);border-radius:999px;padding:7px 16px;font-weight:700;font-size:.88rem;text-decoration:none;display:inline-block;white-space:nowrap}
@media (hover:hover){.add:hover{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}}
.add:active{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.add:disabled{opacity:.5;cursor:not-allowed}

/* story + custom */
.story{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px;align-items:center}
.story>*{min-width:0}
.note{background:var(--paper);border:1px solid var(--line);padding:30px 28px;transform:rotate(-1.6deg);box-shadow:0 10px 24px var(--shadow);
  background-image:repeating-linear-gradient(transparent 0 31px,color-mix(in srgb,var(--rose) 28%,transparent) 31px 32px)}
.note p{font-family:var(--f-hand);font-size:1.6rem;line-height:32px;margin:0}
.story h2{font-size:clamp(1.9rem,4vw,2.7rem);margin-bottom:14px}
.story p{color:var(--muted);max-width:52ch;margin:0 0 12px}
.cform{background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 22px 22px;padding:30px;max-width:760px;margin-inline:auto;box-shadow:0 12px 28px var(--shadow)}
.cform h2{font-size:clamp(1.9rem,4vw,2.6rem);margin:6px 0 10px}
.cform .lead{color:var(--muted);margin:0 0 18px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px}
.frow>*{min-width:0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted)}
.fld input,.fld textarea,.fld select{font:400 1rem var(--f-body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.fld textarea{resize:vertical;min-height:72px}
.chk{display:flex;gap:10px;align-items:center;font-size:.95rem;color:var(--ink);font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--btn)}
.sum{font:400 .86rem/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;background:var(--bg);border:1px dashed var(--rose);border-radius:8px;padding:12px;max-height:240px;overflow:auto;margin:0;direction:ltr;text-align:left}
.fine{font-size:.82rem;color:var(--muted);margin:0}
.err{color:var(--rose-deep);font-weight:700}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links .btn{flex:1;min-width:140px;padding:12px 14px}

footer{margin-top:64px;border-top:1px solid var(--line);padding-block:30px 40px;display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;color:var(--muted);font-size:.92rem}
footer b{font:600 1.5rem var(--f-display);color:var(--ink)}
footer a{color:var(--rose-deep);font-weight:700}

/* detail page */
.detail{position:fixed;inset:0;z-index:35;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dtop{padding-block:14px}
.back{background:none;border:0;color:var(--rose-deep);font-weight:700;padding:6px 0;text-align:start}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding-bottom:60px;align-items:start}
.dgrid>*{min-width:0}
.dmain{position:relative;aspect-ratio:1/1;background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 22px 22px;overflow:hidden;display:grid;place-items:center}
.dmain img{width:100%;height:100%;object-fit:cover}
.dmain svg{width:72%;height:auto}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.tb{width:68px;height:68px;border:2px solid var(--line);border-radius:8px;padding:0;overflow:hidden;background:var(--paper)}
.tb img{width:100%;height:100%;object-fit:cover;display:block}
.tb[aria-pressed="true"]{border-color:var(--rose-deep)}
.dinfo h2{font-size:clamp(2rem,4.5vw,3rem);margin:4px 0 6px}
.dprice{font:600 1.8rem var(--f-display);margin:8px 0 12px}
.dinfo .lead{color:var(--muted);margin:0 0 16px}
.grp{margin-bottom:16px}
.grp h3{margin:0 0 8px;font-size:.85rem;font-weight:700;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.92rem}
.opt[aria-pressed="true"]{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--bg)}
.buyrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0 22px}
.qty{display:inline-flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);line-height:1;padding:0}
.qty span{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.facts{border-top:1px dashed var(--line);padding-top:16px;display:grid;gap:16px}
.facts h3{margin:0 0 6px;font:600 1.3rem var(--f-display)}
.facts p{margin:0;color:var(--muted)}
.facts ul{margin:0;padding-inline-start:20px;color:var(--muted)}

/* modal (scent finder) */
.modal{position:fixed;inset:0;z-index:45;background:rgba(40,22,24,.5);display:grid;place-items:center;padding:16px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto}
.qb{padding:6px 20px 22px}
.qb h3{font-size:1.7rem;margin:8px 0 14px}
.qopts{display:grid;gap:10px}
.qopt{background:var(--bg);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 16px;text-align:start;font-weight:700}
.qopt:hover{border-color:var(--rose-deep)}
.qres{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--bg)}
.qres>*{min-width:0}
.qres b{font:600 1.2rem var(--f-display)}
.qstep{font-size:.8rem;color:var(--muted);font-weight:700}

/* cart drawer */
.scrim{position:fixed;inset:0;background:rgba(40,22,24,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(430px,100%);background:var(--paper);z-index:50;transform:translateX(calc(105% * var(--dir)));transition:transform .3s;display:flex;flex-direction:column;
  border-inline-start:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
aside.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:1.9rem}
.x{background:none;border:0;color:var(--ink);font-size:1.6rem;line-height:1;padding:4px 8px}
.db{flex:1;overflow:auto;padding:8px 20px 20px}
.empty{text-align:center;color:var(--muted);padding:48px 12px}
.empty .hand{display:block;font-size:1.8rem;margin-bottom:6px}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}
.line>*{min-width:0}
.thumb{width:64px;height:64px;border-radius:8px;background:var(--bg);display:grid;place-items:center;overflow:hidden;position:relative}
.thumb svg{width:84%}
.thumb img{width:100%;height:100%;object-fit:cover}
.line h3{margin:0;font:600 1.15rem var(--f-display)}
.line small{color:var(--muted);display:block}
.line .qty{margin-top:4px}
.lt{font-variant-numeric:tabular-nums;font-weight:700}
.df{border-top:1px solid var(--line);padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px}
.tot{display:flex;justify-content:space-between;font:600 1.5rem var(--f-display)}
.df .btn{width:100%}
.df .links .btn{width:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:.9rem;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* featured candle */
.feat{display:grid;grid-template-columns:.9fr 1.1fr;gap:32px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 26px 26px;padding:26px;box-shadow:0 14px 32px var(--shadow);position:relative}
.feat>*{min-width:0}
.feat::before{content:"";position:absolute;inset:8px;border:1.5px dashed var(--rose);border-radius:inherit;opacity:.45;pointer-events:none}
.fart{aspect-ratio:1/.9;border-radius:14px;overflow:hidden;display:grid;place-items:center;position:relative;text-decoration:none}
.fart svg{width:70%;height:auto}
.fart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat h2{font-size:clamp(2rem,4.5vw,3rem);margin:4px 0 8px}
.feat .lead{color:var(--muted);margin:0 0 12px}
.fnote{font-family:var(--f-hand);font-size:1.5rem;color:var(--sage-deep);margin:0 0 14px;line-height:1.2}
.featrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

/* galleries */
.lead2{color:var(--muted);max-width:60ch;margin:0 0 20px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gi{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 18px 18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.gi.vid{grid-column:span 2}
.gb{display:block;width:100%;aspect-ratio:1/1;padding:0;border:0;background:var(--chip);cursor:zoom-in}
.gb img{width:100%;height:100%;object-fit:cover;display:block}
.gi video,.gi iframe{width:100%;aspect-ratio:16/10;border:0;background:#000;display:block}
.gi figcaption{padding:10px 14px 12px;font-size:.9rem;color:var(--muted)}
.gi figcaption b{display:block;color:var(--ink);font:600 1.1rem var(--f-display)}
.lb{position:fixed;inset:0;z-index:55;background:rgba(30,16,18,.9);display:grid;grid-template-rows:1fr auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.lb .stage{display:grid;place-items:center;min-height:0}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lb .cap{color:#f3e4de;text-align:center;padding-top:10px;min-height:1.6em}
.lb .x{color:#fff;position:absolute;font-size:2rem}
.lbc{top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:14px}
.lbn{top:50%;transform:translateY(-50%);background:rgba(0,0,0,.35)!important;border-radius:50%;width:44px;height:44px}
.lbp{inset-inline-start:10px}
.lbnx{inset-inline-end:10px}
.lbn span{display:inline-block;transform:scaleX(var(--dir))}

/* whatsapp button, share, notify */
.fab{position:fixed;z-index:36;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px),env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;background:var(--sage-deep);color:var(--bg);text-decoration:none;font-weight:700;border-radius:999px;padding:12px 18px 12px 14px;box-shadow:0 8px 22px var(--shadow)}
.fab svg{flex:none}
.share{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 20px}
.btn.sm{padding:7px 16px;font-size:.88rem}
.notify{border:1px dashed var(--rose);border-radius:12px;padding:14px;margin:0 0 18px;display:flex;flex-direction:column;gap:10px}

@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1deg)}35%{transform:scale(.94,1.07) rotate(1.5deg)}70%{transform:scale(1.03,.96) rotate(-1.5deg)}}
.flame{animation:flick 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:reduce){.flame{animation:none}.card,aside,.scrim,.toast{transition:none}}

  /* candle page: swipe gallery + sticky buy bar */
  .dmain{aspect-ratio:1/.9}

/*motion-css*/
/* ===== Motion (shared by index, about, events; built in from motion/) ===== */
/* Cozy candle-lighting intro, first page of a visit only (about 5.5s; shop shows from about 4s; tap to skip):
   dim warm room -> spark -> flame catches -> warm glow + drifting embers -> name -> handwritten subtitle -> light spreads to reveal the page */
.intro{display:none}
html.intro-on .intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;overflow:hidden;cursor:pointer;background:#1b1213;color:#f6e6dc}
html.intro-on .intro::before{content:"";position:absolute;inset:0;opacity:0;animation:iRoom 2.2s ease-out .85s forwards;
  background:radial-gradient(circle at var(--fx,50%) var(--fy,42%),#56372b 0%,#33221e 34%,#1b1213 72%)}
html.intro-on:not(.hole) .intro{animation:iFade 1.3s ease-in-out 4s forwards}
html.intro-on.hole .intro{--hole:-240px;animation:iHole 1.5s cubic-bezier(.55,.05,.35,1) 3.95s forwards;
  -webkit-mask-image:radial-gradient(circle at var(--fx,50%) var(--fy,42%),transparent var(--hole),#000 calc(var(--hole) + 220px));
  mask-image:radial-gradient(circle at var(--fx,50%) var(--fy,42%),transparent var(--hole),#000 calc(var(--hole) + 220px))}
html.intro-on.intro-skip .intro{animation:iSkip .5s ease forwards}
.i-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px;animation:iIn .9s ease-out .1s both,iInOut .8s ease-in 3.8s forwards}
.i-scene{position:relative;width:clamp(150px,20vmin,210px);aspect-ratio:1;isolation:isolate}
.i-glow{position:absolute;left:50%;top:37.3%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;pointer-events:none;z-index:0;opacity:0;transform:scale(.3);
  background:radial-gradient(circle,rgba(255,214,150,.62) 0%,rgba(250,190,120,.26) 22%,rgba(246,180,110,.1) 42%,rgba(246,180,110,0) 66%);
  animation:iGlowIn 2.2s cubic-bezier(.2,.7,.2,1) .9s forwards,iBreathe 3.4s ease-in-out 3.1s infinite,iGlowOut 1.4s ease-in 3.9s forwards}
.i-cup{position:relative;z-index:1;display:block;width:100%;height:100%;overflow:visible;filter:brightness(.45) saturate(.7);animation:iWarm 1.8s ease-out .85s forwards}
.i-flame{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);animation:iFlame 1.2s cubic-bezier(.25,.8,.3,1) .8s forwards,iFlick 3.2s ease-in-out 2.05s infinite}
.i-spark{transform-box:fill-box;transform-origin:center;opacity:0;animation:iSpark .75s ease-out .7s}
.i-ember{position:absolute;z-index:2;left:50%;top:30.7%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#ffd79a;box-shadow:0 0 6px 2px rgba(255,190,110,.55);opacity:0;
  animation:iEmber var(--t,2.8s) ease-out var(--d,2s) 2 both}
.i-name{position:relative;font:600 2.6rem/1.1 var(--f-display);color:#f6e6dc;letter-spacing:.06em;margin:16px 0 0;text-shadow:0 0 22px rgba(255,190,120,.28);opacity:0;
  animation:iName 1.4s cubic-bezier(.2,.7,.2,1) 1.4s forwards}
.i-sub{position:relative;font:500 1.5rem/1.3 var(--f-hand);color:#eaa9a3;margin:6px 0 0;clip-path:inset(0 100% 0 0);animation:iWrite 1.3s cubic-bezier(.45,.05,.35,1) 1.9s forwards}
html[dir="rtl"] .i-sub{clip-path:inset(0 0 0 100%)}
html[lang="ar"] .i-sub [lang="en"],html:not([lang="ar"]) .i-sub [lang="ar"]{display:none}
@keyframes iRoom{to{opacity:1}}
@keyframes iIn{from{opacity:0;transform:translateY(12px)}}
@keyframes iInOut{to{opacity:0;transform:translateY(-12px) scale(.98)}}
@keyframes iWarm{to{filter:brightness(1) saturate(1)}}
@keyframes iSpark{0%{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(1.8)}100%{opacity:0;transform:scale(.4)}}
@keyframes iFlame{0%{transform:scale(0)}30%{transform:scale(.32,.5)}48%{transform:scale(.26,.4)}100%{transform:scale(1)}}
@keyframes iFlick{0%,100%{transform:scale(1,1) rotate(-1deg)}30%{transform:scale(.96,1.05) rotate(1.2deg)}60%{transform:scale(1.03,.97) rotate(-1.4deg)}80%{transform:scale(.98,1.03) rotate(.6deg)}}
@keyframes iGlowIn{to{opacity:1;transform:scale(1)}}
@keyframes iBreathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.82;transform:scale(1.07)}}
@keyframes iGlowOut{to{opacity:0;transform:scale(3.4)}}
@keyframes iEmber{0%{opacity:0;transform:translate(0,0) scale(.7)}18%{opacity:.95}100%{opacity:0;transform:translate(var(--x,0px),-120px) scale(.2)}}
@keyframes iName{from{opacity:0;letter-spacing:.34em;transform:translateY(8px)}to{opacity:1;letter-spacing:.06em;transform:none}}
@keyframes iWrite{to{clip-path:inset(0 0 0 0)}}
@keyframes iHole{to{--hole:170vmax;visibility:hidden}}
@keyframes iFade{to{opacity:0;visibility:hidden}}
@keyframes iSkip{to{opacity:0;visibility:hidden}}

/* sections drift up softly as they come into view (.rv = one block, .rvs = its children one after another) */
html.motion:not(.rv-off) .rv:not(.in),html.motion:not(.rv-off) .rvs:not(.in)>*{opacity:0;transform:translateY(22px)}
html.motion .rv.in,html.motion .rvs.in>*{animation:rvIn 1.3s cubic-bezier(.22,.61,.36,1) var(--dl,0s) backwards}
@keyframes rvIn{from{opacity:0;transform:translateY(22px)}}

/* header gets a soft shadow when scrolling */
html.motion header{transition:box-shadow .6s ease}
html.scrolled header{box-shadow:0 8px 24px var(--shadow)}

/* candle page, scent finder and photo viewer open slowly and softly */
html.motion .detail{animation:dIn .65s cubic-bezier(.22,.61,.36,1);transform-origin:var(--ox,50%) var(--oy,35%)}
html.motion .detail.closing{animation:dOut .38s cubic-bezier(.4,0,.6,1) forwards;pointer-events:none}
html.motion .modal:not([hidden]){animation:fIn .45s ease}
html.motion .modal:not([hidden]) .panel{animation:pIn .6s cubic-bezier(.22,.61,.36,1)}
html.motion .lb:not([hidden]){animation:fIn .4s ease}
@keyframes dIn{from{opacity:0;transform:scale(.92)}}
@keyframes dOut{to{opacity:0;transform:scale(.97)}}
@keyframes pIn{from{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes fIn{from{opacity:0}}

/* page to page: View Transitions where supported, a soft fade everywhere else */
@media (prefers-reduced-motion:no-preference){
  @view-transition{navigation:auto}
  header{view-transition-name:site-head}
  ::view-transition-old(root){animation:vtOut .45s ease both}
  ::view-transition-new(root){animation:vtIn .8s cubic-bezier(.22,.61,.36,1) both}
}
@keyframes vtOut{to{opacity:0;transform:translateY(-10px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(14px)}}
html.leaving main{opacity:0;transform:translateY(-10px);transition:opacity .3s ease,transform .3s ease}
html.arrive main{animation:pgIn .8s cubic-bezier(.22,.61,.36,1)}
@keyframes pgIn{from{opacity:0;transform:translateY(14px)}}

/* ===== Tablets & touch screens (shared by index, about, events; built in from motion/) ===== */

/* announcement close button and form boxes big enough for a finger everywhere */
#annX{min-width:44px;min-height:44px;margin-block:-10px}
.fld input,.fld select{min-height:44px}

/* finger-sized controls on any touch screen (phones, iPads), and 16px text so iPads don't zoom into boxes */
/* (menu links are hidden on phones, so only size them where they show) */
@media (pointer:coarse) and (min-width:761px){
  nav a.lnk{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
}
@media (pointer:coarse){
  .logo{min-height:44px;align-items:center}
  .langbtn,.cartbtn{min-height:44px}
  .back{min-height:44px;display:inline-flex;align-items:center}
  .tools input,.tools select{font-size:16px;min-height:44px}
  .chip{min-height:44px;padding-inline:18px}
  .opt{min-height:44px}
  .qty{gap:6px}
  .qty button{width:44px;height:44px;font-size:1.2rem}
  .add{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  .btn.sm{min-height:44px;display:inline-flex;align-items:center}
  .qopt{min-height:48px}
  .info h3 a{display:flex;align-items:center;min-height:44px}
  .chk{min-height:44px}
  .wlink{min-height:44px}
  .lbn{width:48px;height:48px}
}

/* iPads and up: three candles per row from iPad portrait width */
@media (min-width:761px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}
/* iPad portrait: compact header so nothing wraps */
@media (min-width:761px) and (max-width:960px){
  .logo span{display:none}
  nav{gap:14px}
  nav a.lnk{font-size:.9rem}
}
/* iPad portrait and landscape: centred promise line, slightly tighter grid */
@media (min-width:761px) and (max-width:1100px){
  .promise ul{justify-content:center;gap:10px 34px}
  .grid{gap:18px}
}

/* iPads and desktop: the shelf's search, sort and "Find my scent" stay on one tidy row,
   beside the title when there is room, otherwise together on the line under it */
@media (min-width:761px){
  .tools{flex-wrap:nowrap;flex:0 1 auto;min-width:0}
  .tools input{flex:1 1 auto;width:240px;min-width:150px}
}
/*/shared-css*/
/*arabic-css*/
/* ===== Arabic edition (shared by index, about, events; built in from motion/) =====
   "Anne's handwriting": Ruqaa (Aref Ruqaa) for everything Anne would write by hand - the shop name, headings,
   candle names, labels, her note - and a calm Naskh (Amiri) for everything you read or tap.
   One ornament only: the calligrapher's rhombic pen dot (nuqta), which marks the promise list. Arabic never gets letter-spacing or slanting (both break the joins). */
html[lang="ar"]{font-size:112.5%;
  --f-display:"Aref Ruqaa","Amiri","Geeza Pro",serif;
  --f-hand:"Aref Ruqaa","Amiri","Geeza Pro",serif;
  --f-body:"Amiri","Noto Naskh Arabic","Geeza Pro","Arabic Typesetting",serif}
html[lang="ar"] body{font-size:18px;line-height:1.85}
html[lang="ar"] *{letter-spacing:0!important}
html[lang="ar"] :is(em,i,cite,dfn,var){font-style:normal}
html[lang="ar"] [lang="en"]{font-family:"Karla","Trebuchet MS",system-ui,sans-serif}
html[lang="ar"] :is(h1,h2,h3){font-weight:700;line-height:1.42}
html[lang="ar"] :is(.hero,.ahero) h1 em{color:inherit;font-weight:inherit}

/* the logotype: متجر آن, lettered in Ruqaa */
.lg{display:none;fill:currentColor;overflow:visible}
html[lang="ar"] .logo .lg{display:block;height:50px;width:auto;aspect-ratio:336/167;margin-block:-4px}
html[lang="ar"] .logo>b,html[lang="ar"] .logo>span{display:none}
html[lang="ar"] .logo{align-items:center}
html[lang="ar"] footer .lg{display:block;height:58px;width:auto;aspect-ratio:336/167;color:var(--ink);margin:0 0 4px}
html[lang="ar"] footer b{display:none}
html[lang="ar"] footer b+br{display:none}

/* handwritten notes above headings lean a little, like a note in a book's margin */
html[lang="ar"] .hand{font-weight:400;line-height:1.5}
html[lang="ar"] :is(.hero,.ahero,.head,.cform,.feat,.ctas,.evform) .hand:not(:empty){display:inline-block;rotate:2.5deg;transform-origin:100% 100%;font-size:1.4rem;line-height:1.5;color:var(--rose-deep);margin-bottom:2px}

/* headings */
html[lang="ar"] .hero h1{line-height:1.38;margin:8px 0 22px}
html[lang="ar"] .ahero h1{line-height:1.4}
html[lang="ar"] .head{margin-bottom:22px}
html[lang="ar"] :is(.hero p.lead,.ahero p,.story p,.lead2,.cform .lead,.feat .lead,.ctas p,.dinfo .lead){line-height:1.9}

/* buttons and controls: Naskh, with a line height that keeps them slim */
html[lang="ar"] :is(.btn,.add,.chip,.opt,.qopt,.langbtn,.cartbtn,.back,.wlink,.cb-btn,.fab){line-height:1.45}
html[lang="ar"] .btn{padding-block:11px 13px}
html[lang="ar"] .langbtn{font-weight:700;font-size:.8rem}
html[lang="ar"] nav a.lnk{font-size:1rem}
html[lang="ar"] .cartbtn i{font-size:.8rem}

/* the promise line: handwritten, each marked with a pen dot */
html[lang="ar"] .promise ul{font:400 1.22rem/1.6 var(--f-hand)}
html[lang="ar"] .promise li::before{content:"";display:inline-block;width:.5em;height:.42em;margin-inline-end:.55em;vertical-align:.08em;
  background:var(--rose-deep);clip-path:polygon(46% 0,100% 40%,56% 100%,0 62%)}

/* candles: the name and size are written like a jar label; prices read clearly in Naskh with Arabic digits */
html[lang="ar"] .info{gap:4px}
html[lang="ar"] .info h3{font-size:1.45rem;line-height:1.35}
html[lang="ar"] .size{font-size:1.08rem;line-height:1.5}
html[lang="ar"] .notes{line-height:1.75}
html[lang="ar"] :is(.price,.dprice,.bprice,.tot,.lt,.qres .price){font-family:var(--f-body);font-weight:700}
html[lang="ar"] .tag{font:700 .82rem/1.5 var(--f-hand);padding:1px 10px 3px;border-radius:2px 10px 2px 10px}
html[lang="ar"] .stamp{font:700 .84rem/1.2 var(--f-hand);padding:6px;box-shadow:inset 0 0 0 5px var(--sage),inset 0 0 0 6.5px #26301f66;border-style:solid;border-color:transparent}
html[lang="ar"] :is(.grp h3,.qstep,.fld){font-family:var(--f-body)}
html[lang="ar"] .line h3{line-height:1.4}
html[lang="ar"] .facts h3{line-height:1.4}

/* Anne's note on the story page: Ruqaa on wider ruled lines, signed with her name */
html[lang="ar"] .note{background-image:repeating-linear-gradient(transparent 0 43px,color-mix(in srgb,var(--rose) 28%,transparent) 43px 44px);padding-top:24px}
html[lang="ar"] .note p{font-size:1.38rem;line-height:44px}
.sig .lg{height:46px;width:auto;aspect-ratio:124/138;margin-inline-start:auto;overflow:hidden;color:var(--ink)}
html[lang="ar"] .sig .lg{display:block}
html[lang="ar"] .sig [lang="en"]{display:none}
html[lang="ar"] .stp .hand{font:700 2.2rem/1.2 var(--f-hand);color:var(--rose-deep)}

/* forms */
html[lang="ar"] .fld{font-size:.84rem}
html[lang="ar"] :is(.fld input,.fld textarea,.fld select,.tools input,.tools select){line-height:1.5}
html[lang="ar"] .fld textarea{line-height:1.8}

@media (max-width:760px){
  html[lang="ar"] .logo .lg{height:44px}
  html[lang="ar"] .hero h1{line-height:1.42;margin:4px 0 14px}
  html[lang="ar"] .tools input{flex:1 1 100%}
  html[lang="ar"] .tools select{flex:1;min-width:0}
  html[lang="ar"] .info h3{font-size:1.3rem}
  html[lang="ar"] .promise ul{font-size:1.15rem}
  html[lang="ar"] .stamp{font-size:.72rem}
}

/* intro in Arabic: the name arrives softly (no letter-spacing) */
html[lang="ar"] .i-name [lang="en"],html:not([lang="ar"]) .i-name .lg{display:none}
html[lang="ar"] .i-name{animation-name:iNameAr;margin-top:18px}
html[lang="ar"] .i-name .lg{display:block;height:clamp(64px,11vmin,92px);width:auto;aspect-ratio:336/167;color:#f6e6dc;filter:drop-shadow(0 0 18px rgba(255,190,120,.3))}
html[lang="ar"] .i-sub{font-size:1.4rem;line-height:1.6;margin-top:2px}
@keyframes iNameAr{from{opacity:0;transform:translateY(8px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
/*/arabic-css*/
</style>

  const left = kLeft(k), seats = num(k.seats);
  if (left === null) return "";
  const taken = seats ? Math.max(0, seats - left) : 0;
  const dots = seats && seats <= 24 ? `<span class="dots" aria-hidden="true">${Array.from({length:seats}, (_, i) => `<i class="${i < taken ? "" : "o"}"></i>`).join("")}</span>` : "";
  const txt = left === 0 ? t("k_full_txt") : left === 1 ? t("k_left1") : t("k_left").replace("{n}", N(left));
  return `<div class="kseats${left > 0 && left <= 2 ? " low" : ""}">${dots}<span>${esc(txt)}</span></div>`;
}
function cardHTML(k, i){
  const full = kLeft(k) === 0, c = PAL[i % PAL.length], img = /^(images\/|https:\/\/)[^\s"'<>]+$/.test(k.image || "") ? k.image : "";
  const level = L(k, "level"), len = L(k, "length"), place = L(k, "place"), about = L(k, "about"), inc = L(k, "includes"), price = +k.price || 0;
  return `<article class="kc sz" data-sz=".94" id="k-${esc(k.id)}">
    <div class="kc-art" style="background:color-mix(in srgb, ${c[0]} 18%, var(--paper))">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : basket(c)}${kTile(k)}</div>
    <div class="kc-body">
      ${level || full ? `<div class="kc-top">${level ? `<span class="klevel">${esc(level)}</span>` : ""}${full ? `<span class="kfull">${esc(t("k_full"))}</span>` : ""}</div>` : ""}
      <h3>${esc(L(k, "title"))}</h3>
      <p class="kmeta"><span>${ICON.clock}${esc(kWhen(k))}</span>${len ? `<span>${ICON.timer}${esc(len)}</span>` : ""}</p>
      ${place ? `<p class="kmeta"><span>${ICON.pin}${esc(place)}</span></p>` : ""}
      ${about ? `<p class="kabout">${esc(about)}</p>` : ""}
      ${inc ? `<p class="kinc"><b>${esc(t("k_inc"))}</b> ${esc(inc)}</p>` : ""}
      <div class="kfoot"><div><span class="kprice">${esc(price ? fmt(price) : t("k_free"))}${price ? `<small>${esc(t("k_each"))}</small>` : ""}</span>${seatsHTML(k)}</div>
        <button class="btn${full ? " ghost" : ""}" type="button" data-book="${esc(k.id)}">${esc(t(full ? "k_wait" : "k_book"))}</button></div>
    </div></article>`;
}
function newsHref(){ return waNum() ? waUrl("Hi Anne, please tell me when new blanket classes are announced.") : "https://ig.me/m/" + igH(); }
function renderList(){
  if (failed) { $("klist").innerHTML = `<p class="fine">${esc(t("k_load_err"))}</p>`; return; }
  if (!loaded) { $("klist").innerHTML = `<p class="fine">${esc(t("k_loading"))}</p>`; return; }
  const list = upcoming();
  $("klist").innerHTML = list.length ? list.map(cardHTML).join("")
    : `<div class="kempty"><p>${esc(t("k_none"))}</p><a class="btn" target="_blank" rel="noopener" href="${esc(newsHref())}">${esc(t("k_notify"))}</a></div>`;
}
function jumpToHash(){
  const h = decodeURIComponent(location.hash || ""); if (!/^#k-/.test(h)) return;
  const el = document.getElementById(h.slice(1)); if (!el) return;
  el.scrollIntoView({block:"start"}); el.classList.add("hl"); setTimeout(() => el.classList.remove("hl"), 2600);
}

/* ---- sending a message (WhatsApp fills it in; Instagram gets it copied) ---- */
const WA_ICO = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16v11H10l-6 4z"/><path d="M8.5 10.5h7"/></svg>`;
const IG_ICO = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".8" fill="currentColor"/></svg>`;
function sendLinks(txt, ids){
  $(ids.sum).textContent = txt;
  const wa = waNum() ? `<a class="btn wa" target="_blank" rel="noopener" href="${esc(waUrl(txt))}">${WA_ICO} ${esc(t("wa_send"))}</a>` : "";
  $(ids.links).innerHTML = wa + `<a class="btn wa ig igdm" target="_blank" rel="noopener" href="https://ig.me/m/${igH()}">${IG_ICO} ${esc(t("ig_send"))}</a><button class="btn ghost" type="button" data-copy="1">${esc(t("copy"))}</button>`;
  $(ids.fine).textContent = t(waNum() ? "fine_wa" : "fine_ig");
}
function copyTxt(txt, ok, bad){ try { navigator.clipboard.writeText(txt).then(ok, bad); } catch(e) { bad(); } }
function selectPre(pre){ const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
function wireLinks(links, getTxt, pre, hint){
  $(links).addEventListener("click", e => {
    if (e.target.closest("[data-copy]")) { copyTxt(getTxt(), () => toast(t("copied")), () => { selectPre($(pre)); toast(t("select_copy")); }); return; }
    if (e.target.closest(".igdm")) { const h = $(hint); copyTxt(getTxt(), () => { h.textContent = t("ig_hint"); h.hidden = false; }, () => { selectPre($(pre)); h.textContent = t("ig_fail"); h.hidden = false; }); }
  });
}
const savedName = () => { try { return localStorage.getItem("anneshop-name") || ""; } catch(e) { return ""; } };
const rememberName = v => { v = String(v || "").trim(); if (v) try { localStorage.setItem("anneshop-name", v.slice(0, 40)); } catch(e) {} };

/* ---- booking a seat ---- */
let bk = null;
function maxSeats(){ const l = kLeft(bk.k); return bk.wait || l === null ? 10 : Math.max(1, l); }
function bookText(){
  const k = bk.k, price = +k.price || 0;
  const out = [bk.wait ? "Class waiting list - Anne Shop" : "Class booking - Anne Shop", "", "Class: " + (k.title || k.title_ar || ""), "When: " + kWhenEn(k), (bk.wait ? "Seats wanted: " : "Seats: ") + bk.qty];
  if (!bk.wait && price) out.push("Price: " + fmtEn(price) + " each, " + fmtEn(price * bk.qty) + " total");
  out.push("", "Name: " + bk.name.trim(), "Phone: " + toLatin(bk.phone.trim()));
  return out.join("\n");
}
function renderBook(){
  const k = bk.k, price = +k.price || 0, len = L(k, "length"), place = L(k, "place");
  $("bTitle").textContent = t(bk.wait ? "b_wait_title" : "b_title");
  $("bBody").innerHTML = `<div class="bk">
    <div class="bk-k">${kTile(k)}<span><b>${esc(L(k, "title"))}</b><small>${esc(kWhen(k))}${len ? " · " + esc(len) : ""}</small>${place ? `<small>${esc(place)}</small>` : ""}</span></div>
    ${bk.wait ? `<p class="fine">${esc(t("b_wait_intro"))}</p>` : ""}
    <div class="grp"><h3>${esc(t("b_seats"))}</h3><div class="qty"><button type="button" data-d="-1" aria-label="${esc(t("qty_minus"))}">−</button><span id="bQty">${N(bk.qty)}</span><button type="button" data-d="1" aria-label="${esc(t("qty_plus"))}">+</button></div></div>
    ${!bk.wait && price ? `<div class="bk-tot"><span>${esc(t("total"))}</span><span id="bTot">${esc(fmt(price * bk.qty))}</span></div>` : ""}
    <label class="fld" for="bName"><span>${esc(t("f_name"))}</span><input id="bName" autocomplete="name"></label>
    <label class="fld" for="bPhone"><span>${esc(t("f_phone"))}</span><input id="bPhone" inputmode="tel" autocomplete="tel"></label>
    <p class="fine err" id="bErr" hidden>${esc(t("f_err"))}</p>
    <button class="btn" type="button" id="bGo">${esc(t(bk.wait ? "b_prepare_wait" : "b_prepare"))}</button>
    <div id="bOut" hidden><pre class="sum" id="bSum"></pre><p class="ighint" id="bHint" hidden></p><div id="bLinks" style="display:flex;flex-direction:column;gap:10px;margin-top:10px"></div><p class="fine" id="bFine" style="margin-top:10px"></p></div>
  </div>`;
  $("bName").value = bk.name; $("bPhone").value = bk.phone;
  if (bk.built) { $("bOut").hidden = false; sendLinks(bookText(), {sum:"bSum", links:"bLinks", fine:"bFine"}); }
}
const lockable = () => [document.querySelector("header"), document.querySelector("main"), $("waFab")];
function openBook(id, btn){
  const k = CLASSES.find(x => x.id === id); if (!k) return;
  bk = {k:k, qty:1, wait:kLeft(k) === 0, name:savedName(), phone:"", built:false, back:btn};
  renderBook(); $("book").hidden = false; document.body.style.overflow = "hidden";
  lockable().forEach(el => { if (el) el.inert = true; });
  requestAnimationFrame(() => $("bClose").focus());
}
function closeBook(){
  if ($("book").hidden) return;
  $("book").hidden = true; document.body.style.overflow = "";
  lockable().forEach(el => { if (el) el.inert = false; });
  if (bk && bk.back && bk.back.isConnected) bk.back.focus();
  bk = null;
}
$("klist").addEventListener("click", e => { const b = e.target.closest("[data-book]"); if (b) openBook(b.dataset.book, b); });
$("bClose").addEventListener("click", closeBook);
$("book").addEventListener("click", e => { if (e.target === $("book")) closeBook(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeBook(); });
$("bBody").addEventListener("click", e => {
  if (!bk) return;
  const d = e.target.closest("[data-d]");
  if (d) { bk.qty = Math.max(1, Math.min(maxSeats(), bk.qty + +d.dataset.d)); $("bQty").textContent = N(bk.qty); if ($("bTot")) $("bTot").textContent = fmt((+bk.k.price || 0) * bk.qty); if (bk.built) sendLinks(bookText(), {sum:"bSum", links:"bLinks", fine:"bFine"}); return; }
  if (e.target.id === "bGo") {
    const bad = !bk.name.trim() || digits(bk.phone).length < 7;
    $("bErr").hidden = !bad; if (bad) return;
    rememberName(bk.name); bk.built = true; $("bOut").hidden = false; $("bHint").hidden = true;
    sendLinks(bookText(), {sum:"bSum", links:"bLinks", fine:"bFine"}); $("bOut").scrollIntoView({behavior:"smooth", block:"nearest"});
  }
});
$("bBody").addEventListener("input", e => {
  if (!bk) return;
  if (e.target.id === "bName") bk.name = e.target.value; else if (e.target.id === "bPhone") bk.phone = e.target.value; else return;
  if (bk.built) sendLinks(bookText(), {sum:"bSum", links:"bLinks", fine:"bFine"});
});
$("bBody").addEventListener("click", e => {
  if (!bk || !e.target.closest("#bLinks")) return;
  if (e.target.closest("[data-copy]")) { copyTxt(bookText(), () => toast(t("copied")), () => { selectPre($("bSum")); toast(t("select_copy")); }); return; }
  if (e.target.closest(".igdm")) { const h = $("bHint"); copyTxt(bookText(), () => { h.textContent = t("ig_hint"); h.hidden = false; }, () => { selectPre($("bSum")); h.textContent = t("ig_fail"); h.hidden = false; }); }
});

/* ---- private class request ---- */
let pBuilt = false;
function privText(){
  return ["Private class request - Anne Shop", "", "For: " + $("pFor").value, "Group size: " + (digits($("pQty").value) || "-"), "Preferred date: " + ($("pDate").value || "-"),
    "Ideas and questions: " + ($("pIdeas").value.trim() || "-"), "", "Name: " + $("pName").value.trim(), "Phone: " + toLatin($("pPhone").value.trim())].join("\n");
}
$("pGo").addEventListener("click", () => {
  const bad = !$("pName").value.trim() || digits($("pPhone").value).length < 7;
  $("pErr").hidden = !bad; if (bad) return;
  rememberName($("pName").value); pBuilt = true; sendLinks(privText(), {sum:"pSum", links:"pLinks", fine:"pFine"});

document.querySelectorAll("#private input, #private select, #private textarea").forEach(el => el.addEventListener("input", () => { if (pBuilt) sendLinks(privText(), {sum:"pSum", links:"pLinks", fine:"pFine"}); }));
wireLinks("pLinks", privText, "pSum", "pHint");

/* ---- language, links, loading ---- */
function apply(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t(e.dataset.t); });

  document.querySelectorAll("[data-al]").forEach(e => { e.setAttribute("aria-label", t(e.dataset.al)); });

  $("langBtn").textContent = t("lang_btn"); $("langBtn").lang = lang === "ar" ? "en" : "ar"; $("fabText").textContent = t("wa_short"); $("waFab").setAttribute("aria-label", t("wa_chat"));
  document.title = t("doc_title");
  renderList();
  if (bk) renderBook();
  if (pBuilt) sendLinks(privText(), {sum:"pSum", links:"pLinks", fine:"pFine"});
}
function links(){
  $("igLink").href = "https://www.instagram.com/" + igH() + "/"; $("igLink").textContent = "@" + (CONFIG.instagram || "anneshop.bh");
  if (waNum()) { $("waFab").href = waUrl("Hi Anne, I have a question about your blanket classes."); $("waFab").hidden = false; }
}
$("langBtn").addEventListener("click", () => {
  document.documentElement.classList.add("boot");
  lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("anneshop-lang", lang); } catch(e) {}
  if (lang === "ar" && window.__arFonts) window.__arFonts();
  apply(); requestAnimationFrame(() => requestAnimationFrame(() => { document.documentElement.classList.remove("boot"); }));
});
if (savedName()) $("pName").value = savedName();
$("pDate").min = todayISO();
apply();
fetch("products.json?v=" + Date.now(), {cache:"no-store"}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
  CONFIG = (d && d.settings) || {}; CLASSES = Array.isArray(d && d.classes) ? d.classes.filter(k => k && k.id) : [];
  loaded = true; links(); renderList(); jumpToHash();
}).catch(() => { failed = true; renderList(); });
window.addEventListener("hashchange", jumpToHash);
requestAnimationFrame(() => requestAnimationFrame(() => { document.documentElement.classList.remove("boot"); }));
</script>
