<style>
:root{--bg:#f5e8e2;--paper:#fbf3ee;--ink:#47302f;--muted:#7e6164;--rose-deep:#97565b;--line:#e2cbc4;--btn:#8f525a;--btn-ink:#fff8f4;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#271c1e;--paper:#33262a;--ink:#f3e4de;--muted:#c3a7a3;--rose-deep:#e1a3a6;--line:#4a3739;--btn:#e2aaac;--btn-ink:#2a1d1f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Karla","Trebuchet MS",system-ui,sans-serif;padding:24px 16px;text-align:center;
  background-image:radial-gradient(circle at 50% 30%,color-mix(in srgb,#f6c38a 18%,transparent),transparent 55%)}
main{max-width:460px}
svg{width:150px;height:150px;overflow:visible}
.smoke{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;opacity:.55;animation:rise 3.2s ease-in-out infinite}
@keyframes rise{0%{transform:translateY(6px);opacity:0}30%{opacity:.6}100%{transform:translateY(-14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.smoke{animation:none}}
.hand{font:500 1.6rem/1.2 "Caveat","Bradley Hand",cursive;color:var(--rose-deep);margin:10px 0 0}
h1{font:600 clamp(2rem,7vw,2.6rem)/1.15 "Cormorant Garamond",Georgia,serif;margin:6px 0 10px}
p{color:var(--muted);margin:0 0 6px}
p[lang="ar"],h1 [lang="ar"]{font-family:"Tajawal","Karla",system-ui,sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:20px;padding:12px 28px;border-radius:999px;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:700}
.btn:focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px}
.ar{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
</style>
</head>
